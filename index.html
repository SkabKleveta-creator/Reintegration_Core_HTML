  *{margin:0;padding:0;box-sizing:border-box;}

  /* ── Quick Tool Bar (NEW: replaces SELECT-menu detour for access) ── */
  #toolbar{display:none;width:100%;max-width:640px;margin:8px auto 0;justify-content:center;gap:5px;z-index:14;padding:0 6px;flex-wrap:wrap;flex:0 0 auto;}

  .qtool:active{background:rgba(91,155,213,0.3);}
  .qtool.eqA{border-color:#5b9bd5;box-shadow:0 0 6px rgba(91,155,213,0.5);}
  .qtool.eqB{border-color:#ff5a5a;box-shadow:0 0 6px rgba(255,90,90,0.5);}
  .qtool.fired{background:#fff;}
  .qtool .slot{font-size:5px;padding:0 3px;border-radius:2px;margin-top:1px;}
  .qtool .slot.A{background:#5b9bd5;color:#06121f;}
  .qtool .slot.B{background:#ff5a5a;color:#1f0606;}

  /* ── Tabletop side panel: intent log + validate (NEW) ── */
  /* Inline panel: flows directly under the canvas, never overlaps play or controls. */
  #ttpanel{display:none;width:100%;max-width:640px;margin:4px auto 0;background:rgba(13,15,30,0.92);border:1.5px solid rgba(91,155,213,0.4);border-radius:6px;flex-direction:column;overflow:hidden;flex:0 0 auto;}

  .ttact.on{border-color:#69f0ae;color:#b8ffe9;box-shadow:0 0 6px rgba(105,240,174,0.35);}
  #ttprocedure{display:none;padding:5px 8px;border-bottom:1px solid rgba(91,155,213,0.15);background:rgba(6,10,20,0.42);}

  init(){if(this.ready)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=0.5;this.master.connect(this.ctx.destination);this.ready=true;}catch(e){this.ready=false;}},

let grappleState=null;
let grappleFailFlash=0;
function roomAnchors(){return GRAPPLE_ANCHORS[currentRoom]||[];}
function playerCenter(){return {x:player.x,y:player.y+PH/2};}
function anchorDist(a){const p=playerCenter();return Math.hypot(a.x-p.x,a.y-p.y);}
function findNearestAnchor(){
  let best=null,bd=Infinity;
  for(const a of roomAnchors()){
    const d=anchorDist(a);
    if(d<bd){best=a;bd=d;}
  }
  if(!best)return {anchor:null,dist:Infinity,reason:'No fixed anchors authored in this room.'};
  if(bd<GRAPPLE_MIN_DIST)return {anchor:best,dist:bd,reason:'Anchor too close. Near-zero-distance safety guard blocked the hook.'};
  if(bd>GRAPPLE_RANGE)return {anchor:best,dist:bd,reason:'Nearest fixed anchor is outside readable range.'};
  return {anchor:best,dist:bd,reason:''};
}
function startGrapple(){
  if(gameState!=='PLAY')return;
  if(grappleState&&grappleState.active){TT.record('HOOK','already connected to a fixed anchor','info');return;}
  const found=findNearestAnchor();
  if(!found.anchor){grappleFailFlash=18;TT.record('HOOK',found.reason,'bad');showDialogue('HOOK FAILED.\nNO FIXED ANCHOR.');Audio.fail();return;}
  if(found.reason){grappleFailFlash=18;TT.record('HOOK',found.reason+' '+found.anchor.id,'bad');showDialogue('HOOK FAILED.\n'+found.reason.toUpperCase());Audio.fail();return;}
  const a=found.anchor;
  player.vx=0;player.vy=0;player.onLadder=false;player.onGround=false;
  grappleState={active:true,anchor:a,sx:player.x,sy:player.y,tx:a.landX,ty:a.landY,t:0,dur:GRAPPLE_DURATION};
  TT.record('HOOK','fixed anchor connected: '+a.id+' ('+a.label+'). Controlled pull engaged.','good');
  showDialogue('HOOK CONNECTED.\nFIXED ANCHOR ONLY.');
}
function updateGrappleMotion(){
  if(!grappleState||!grappleState.active)return false;
  const g=grappleState;
  g.t++;
  const p=Math.min(1,g.t/g.dur);
  const eased=1-Math.pow(1-p,3);
  player.x=g.sx+(g.tx-g.sx)*eased;
  player.y=g.sy+(g.ty-g.sy)*eased;
  player.vx=0;player.vy=0;player.onGround=false;player.onLadder=false;
  if(g.t>=g.dur){
    player.x=g.tx;player.y=g.ty;player.vx=0;player.vy=0;grappleState=null;snapToFloor();TT.push('HOOK route complete. Access established through authored anchor.','good');
  }
  return true;
}
function renderGrappleAnchors(oy){
  const equipped=player.pocket[1]&&player.pocket[1].id==='GRAPPLE';
  if(equipped){
    const p=playerCenter();
    ctx.strokeStyle='rgba(102,227,255,0.18)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x*T,oy+p.y*T,GRAPPLE_RANGE*T,0,Math.PI*2);ctx.stroke();
  }
  roomAnchors().forEach(a=>{
    const x=a.x*T,y=oy+a.y*T;
    const d=anchorDist(a);
    const inRange=d>=GRAPPLE_MIN_DIST&&d<=GRAPPLE_RANGE;
    const active=grappleState&&grappleState.anchor&&grappleState.anchor.id===a.id;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
    ctx.fillStyle=active?'rgba(252,231,110,0.95)':(inRange&&equipped?'rgba(102,227,255,0.92)':'rgba(91,155,213,0.48)');
    ctx.strokeStyle=active?NES.doorLt:(inRange&&equipped?NES.glyphLt:'rgba(130,177,255,0.55)');
    ctx.lineWidth=1.5;ctx.fillRect(-T*0.23,-T*0.23,T*0.46,T*0.46);ctx.strokeRect(-T*0.23,-T*0.23,T*0.46,T*0.46);ctx.restore();
    if(inRange&&equipped){ctx.strokeStyle='rgba(102,227,255,0.35)';ctx.beginPath();ctx.arc(x,y,T*0.45+Math.sin(frame*0.15)*T*0.08,0,Math.PI*2);ctx.stroke();}
  });
  if(grappleState&&grappleState.active){
    const p=playerCenter(),a=grappleState.anchor;
    ctx.strokeStyle='rgba(252,231,110,0.85)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x*T,oy+p.y*T);ctx.lineTo(a.x*T,oy+a.y*T);ctx.stroke();
  }
  if(grappleFailFlash>0){
    grappleFailFlash--;
    const p=playerCenter();ctx.strokeStyle='rgba(255,91,120,'+(grappleFailFlash/18)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x*T,oy+p.y*T,GRAPPLE_RANGE*T,0,Math.PI*2);ctx.stroke();
  }
}

// ── VALIDATION: proof before progress, made digital ──
// A room is proven only when its real state passes. "Green board" never counts as proof.
function validateRoom(){
  if(gameState!=='PLAY')return;
  const id=currentRoom;
  let pass=false, detail='';
  if(id==='R02'){
    let faults=0; for(let r=0;r<ROWS;r++)for(let c=0;c<roomWidth();c++)if(getTile(c,r)==='X')faults++;
    pass = faults===0;
    detail = pass ? 'No faults remain. Route verified clean.' : (faults+' fault(s) still live. Not proven.');
  } else if(id==='R03'){
    const a=!!TT.roomState.R03_relayA, b=!!TT.roomState.R03_relayB;
    pass = a && b;
    if(pass) detail='Both relays confirmed. Sync is real, not just reported.';
    else if(a||b) detail='Board says SYNCED — but only '+(a?'A':'B')+' is truly set. False green.';
    else detail='Board says SYNCED. Neither relay is actually set. The green is a lie.';
  } else if(id==='R12'){
    pass = !!TT.roomState.R12_scanned;
    detail = pass ? 'Route mapped and confirmed open.' : 'Route unmapped. SCAN the sector first.';
  } else if(id==='R04'){
    let heat=0; for(let r=0;r<ROWS;r++)for(let c=0;c<roomWidth();c++){const t=getTile(c,r);if(t==='V'||t==='~')heat++;}
    pass = heat===0;
    detail = pass ? 'All vents cooled. Passage safe.' : (heat+' heat source(s) still active.');
  } else if(id==='R05'){
    let cat=0; for(let r=0;r<ROWS;r++)for(let c=0;c<roomWidth();c++)if(getTile(c,r)==='C')cat++;
    pass = cat===0;
    detail = pass ? 'All catalyst blocks cleared.' : (cat+' catalyst block(s) remain.');
  } else if(id==='R06'){
    let faults=0; for(let r=0;r<ROWS;r++)for(let c=0;c<roomWidth();c++)if(getTile(c,r)==='X')faults++;
    const a=!!TT.roomState.R06_relayA, b=!!TT.roomState.R06_relayB;
    pass = faults===0 && a && b;
    if(pass) detail='Faults clear, both relays set. Engine route proven.';
    else detail=(faults?faults+' fault(s) live. ':'')+((!a||!b)?'Relays incomplete.':'');
  } else {
    detail='No validation procedure for this sector.';
  }
  TT.roomState[id+'_validated']=pass;
  if(pass){ Audio.pass(); TT.push('ROUTE PROVEN ✓ '+detail,'good'); showDialogue('ROUTE HOLDS.\n'+detail); }
  else { Audio.fail(); TT.push('DOOR HELD ✗ '+detail,'bad'); showDialogue('THE DOOR WON\u2019T OPEN.\n'+detail); }
  return pass;
}

// ── QUICK TOOL BAR: one-tap access to the six swappable B-tools; PULSE stays fixed on A ──
function buildToolbar(){
  const bar=document.getElementById('toolbar'); if(!bar)return;
  bar.innerHTML='';
  B_TOOLS.forEach((tool)=>{
    const b=document.createElement('div'); b.className='qtool'; b.dataset.tool=tool.id;
    b.innerHTML='<div class="qn">'+tool.name+'</div><div class="qd">'+tool.desc+'</div>';
    b.addEventListener('touchstart',e=>{e.preventDefault();selectB(tool.id);},{passive:false});
    b.addEventListener('click',e=>{e.preventDefault();selectB(tool.id);});
    bar.appendChild(b);
  });
  refreshToolbar();
}
function refreshToolbar(){
  document.querySelectorAll('.qtool').forEach(b=>{
    b.classList.remove('eqA','eqB');
    const slots=b.querySelectorAll('.slot'); slots.forEach(s=>s.remove());
    const id=b.dataset.tool;
    // A is always PULSE (not in tray). Only show the B marker on the loaded B tool.
    if(player.pocket[1]&&player.pocket[1].id===id){b.classList.add('eqB'); const s=document.createElement('div');s.className='slot B';s.textContent='B';b.appendChild(s);}
  });
}
// Tapping a tray tool loads it into pocket B (the swappable slot). Press B to fire it.
// B keeps the selection across rooms until changed.
function selectB(id){
  if(gameState!=='PLAY')return;
  const tool=B_TOOLS.find(t=>t.id===id); if(!tool)return;
  player.pocket[1]=tool;
  refreshToolbar();
  const b=document.querySelector('.qtool[data-tool="'+id+'"]');
  if(b){b.classList.add('fired');setTimeout(()=>b.classList.remove('fired'),160);}
  TT.push('B-tool set: '+tool.name+'. Press B to use.','info');

function renderToolEffect(oy){if(!toolEffect)return;const ex=toolEffect.x*T,ey=oy+toolEffect.y*T;const tt=toolEffect.timer,dur=18,prog=1-(tt/dur);switch(toolEffect.type){
  case'PULSE':{let radius;if(prog<0.35)radius=TOOL_RANGE*T*(0.5*(1-prog/0.35));else{const p2=(prog-0.35)/0.65;radius=TOOL_RANGE*T*p2;}const a=0.7*(1-prog);ctx.strokeStyle='rgba(255,23,68,'+a+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(255,140,140,'+a*0.7+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius*0.7),0,Math.PI*2);ctx.stroke();if(prog>0.35){for(let i=0;i<8;i++){const ang=i/8*Math.PI*2+prog*2;const sx=ex+Math.cos(ang)*radius,sy=ey+Math.sin(ang)*radius;ctx.fillStyle='rgba(255,200,120,'+a+')';ctx.fillRect(sx-1.5,sy-1.5,3,3);}}break;}
  case'SCANNER':{const radius=TOOL_RANGE*T*prog;const a=0.6*(1-prog);ctx.strokeStyle='rgba(68,138,255,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2);ctx.stroke();const sweep=prog*Math.PI*4;const grad=ctx.createLinearGradient(ex,ey,ex+Math.cos(sweep)*radius,ey+Math.sin(sweep)*radius);grad.addColorStop(0,'rgba(130,177,255,'+(0.5*(1-prog))+')');grad.addColorStop(1,'rgba(130,177,255,0)');ctx.strokeStyle=grad;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(sweep)*radius,ey+Math.sin(sweep)*radius);ctx.stroke();break;}
  case'SYNC':{const radius=TOOL_RANGE*T*prog*0.5;const a=0.5*(1-prog);ctx.strokeStyle='rgba(0,200,83,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2);ctx.stroke();break;}
  case'THERMAL':{for(let w=0;w<3;w++){const wp=prog-w*0.18;if(wp<=0)continue;const radius=TOOL_RANGE*T*wp;const a=0.4*(1-wp);const wob=Math.sin(frame*0.5+w)*2;ctx.strokeStyle='rgba(255,140,40,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius+wob),0,Math.PI*2);ctx.stroke();}break;}
  case'CATALYST':{const radius=TOOL_RANGE*T*prog;const a=0.45*(1-prog);ctx.strokeStyle='rgba(170,0,255,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2);ctx.stroke();break;}
  case'READER':{for(let wave=0;wave<3;wave++){const wp=Math.max(0,prog-wave*0.22);if(wp<=0)continue;const r=3.5*T*wp;const a=(0.6*(1-wp))*(1-wave*0.2);ctx.strokeStyle='rgba(0,220,180,'+a+')';ctx.lineWidth=1.5+wave*0.5;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,r),0,Math.PI*2);ctx.stroke();}ctx.fillStyle='rgba(0,220,180,'+(0.5*(1-prog))+')';ctx.beginPath();ctx.arc(ex,ey,T*0.3,0,Math.PI*2);ctx.fill();break;}}}
function renderParticles(){for(const p of particles){const a=Math.max(0,p.life/p.maxLife);switch(p.kind){case'flash':ctx.fillStyle='rgba('+p.color+','+a+')';ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);break;case'spark':case'rise':case'steam':ctx.fillStyle='rgba('+p.color+','+a+')';ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);break;case'reveal':ctx.strokeStyle='rgba('+p.color+','+a+')';ctx.lineWidth=1.5;ctx.strokeRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.fillStyle='rgba('+p.color+','+(a*0.3)+')';ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);break;case'shard':{if(p.rot!==undefined)p.rot+=p.vr||0;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.fillStyle='rgba('+p.color+','+a+')';ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*0.7,0);ctx.lineTo(0,p.size);ctx.lineTo(-p.size*0.7,0);ctx.closePath();ctx.fill();ctx.restore();break;}default:ctx.fillStyle='rgba('+p.color+','+a+')';ctx.fillRect(p.x-1,p.y-1,2,2);}}}
function renderCoolTiles(oy){for(const ct of coolTiles){if(ct.room!==currentRoom)continue;const x=ct.c*T,y=oy+ct.r*T,a=ct.timer/24;ctx.fillStyle='rgba(80,140,255,'+(0.5*a)+')';ctx.fillRect(x,y,T,T);ctx.fillStyle='rgba(200,230,255,'+(0.3*a)+')';ctx.fillRect(x,y,T,2);}}
function renderSyncBeam(){if(!syncBeam)return;const a=Math.min(1,syncBeam.timer/30)*0.7;const pulse=0.5+0.5*Math.sin(frame*0.4);const oy=HUD_ROWS*T;const x0=player.x*T,y0=oy+(player.y+PH/2)*T;ctx.strokeStyle='rgba(0,200,83,'+(a*(0.5+0.5*pulse))+')';ctx.lineWidth=2+pulse*1.5;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(syncBeam.x1,syncBeam.y1);ctx.stroke();ctx.strokeStyle='rgba(130,255,180,'+a+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(syncBeam.x1,syncBeam.y1);ctx.stroke();ctx.fillStyle='rgba(130,255,180,'+a+')';ctx.beginPath();ctx.arc(syncBeam.x1,syncBeam.y1,3+pulse*2,0,Math.PI*2);ctx.fill();}
function drawToolIcon(id,cx,cy,sz){const h=sz/2;ctx.save();ctx.translate(cx,cy);ctx.lineWidth=1.5;ctx.lineCap='round';switch(id){case'PULSE':ctx.strokeStyle=NES.fault;ctx.beginPath();ctx.arc(0,0,h*0.5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,h*0.85,0,Math.PI*2);ctx.stroke();break;case'SCANNER':ctx.strokeStyle=NES.glyphLt;ctx.beginPath();ctx.arc(-h*0.2,-h*0.2,h*0.5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(h*0.15,h*0.15);ctx.lineTo(h*0.7,h*0.7);ctx.stroke();break;case'GRAPPLE':ctx.strokeStyle=NES.doorLt;ctx.beginPath();ctx.arc(-h*0.45,-h*0.05,h*0.22,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-h*0.25,0);ctx.lineTo(h*0.55,-h*0.48);ctx.lineTo(h*0.38,-h*0.18);ctx.moveTo(h*0.55,-h*0.48);ctx.lineTo(h*0.15,-h*0.48);ctx.stroke();break;case'SYNC':ctx.strokeStyle=NES.termOn;ctx.beginPath();ctx.arc(-h*0.45,0,h*0.3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(h*0.45,0,h*0.3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-h*0.15,0);ctx.lineTo(h*0.15,0);ctx.stroke();break;case'THERMAL':ctx.strokeStyle=NES.convLt;for(let a=0;a<6;a++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a*Math.PI/3)*h*0.8,Math.sin(a*Math.PI/3)*h*0.8);ctx.stroke();}break;case'CATALYST':ctx.strokeStyle=NES.catLt;ctx.beginPath();ctx.moveTo(0,-h*0.8);ctx.lineTo(h*0.6,0);ctx.lineTo(0,h*0.8);ctx.lineTo(-h*0.6,0);ctx.closePath();ctx.stroke();break;case'CHKPT':ctx.strokeStyle=NES.stab;ctx.beginPath();ctx.moveTo(-h*0.4,-h*0.8);ctx.lineTo(-h*0.4,h*0.8);ctx.stroke();ctx.fillStyle=NES.stab;ctx.beginPath();ctx.moveTo(-h*0.4,-h*0.8);ctx.lineTo(h*0.5,-h*0.45);ctx.lineTo(-h*0.4,-h*0.1);ctx.closePath();ctx.fill();break;case'READER':ctx.strokeStyle='#00dcb4';ctx.beginPath();ctx.arc(0,0,h*0.3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,h*0.6,0,Math.PI*2);ctx.stroke();break;default:ctx.strokeStyle=NES.hudDim;ctx.strokeRect(-h*0.5,-h*0.5,h,h);}ctx.restore();}
function renderHUD(){const hudH=HUD_ROWS*T;ctx.fillStyle=NES.hudBg;ctx.fillRect(0,0,GW,hudH);ctx.strokeStyle=NES.dialogBd;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,hudH-0.5);ctx.lineTo(GW,hudH-0.5);ctx.stroke();const fs=Math.max(7,Math.floor(T*0.55));ctx.font=fs+'px "Press Start 2P",monospace';ctx.textAlign='left';ctx.fillStyle=NES.hudDim;ctx.fillText('D01-'+currentRoom+'  '+(Math.floor(cameraX)+1)+'/'+roomWidth(),T*0.5,T*0.95);
  // TTRPG: validated stamp
  if(TT.roomState[currentRoom+'_validated']){ctx.fillStyle=NES.stab;ctx.font=Math.floor(fs*0.85)+'px "Press Start 2P",monospace';ctx.fillText('✓ VALIDATED',T*0.5+fs*5,T*0.95);}
  else{ctx.fillStyle=NES.stabLo;ctx.font=Math.floor(fs*0.85)+'px "Press Start 2P",monospace';ctx.fillText('UNVERIFIED',T*0.5+fs*5,T*0.95);}
  ctx.fillStyle=NES.hud;ctx.font=fs+'px "Press Start 2P",monospace';ctx.fillText('STB',T*0.5,T*2.05);const cellW=fs*1.4,cellH=fs*0.95,cellY=T*1.45,x0=T*0.5+fs*2.8;for(let i=0;i<3;i++){const cx=x0+i*(cellW+4);ctx.strokeStyle=NES.hudDim;ctx.lineWidth=1.5;ctx.strokeRect(cx,cellY,cellW,cellH);ctx.fillStyle=NES.hudDim;ctx.fillRect(cx+cellW,cellY+cellH*0.3,2,cellH*0.4);if(i<player.stability){const low=player.stability===1;ctx.fillStyle=low?NES.stabLo:NES.stab;ctx.fillRect(cx+1.5,cellY+1.5,cellW-3,cellH-3);ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(cx+1.5,cellY+1.5,cellW-3,2);}}
  const boxSz=fs*1.6,iy=hudH*0.5;const drawPocket=(label,tool,bx)=>{ctx.strokeStyle=NES.hudDim;ctx.lineWidth=1;ctx.strokeRect(bx,iy-boxSz/2,boxSz,boxSz);ctx.fillStyle=NES.hudDim;ctx.font=Math.floor(fs*0.7)+'px "Press Start 2P",monospace';ctx.textAlign='left';ctx.fillText(label,bx,iy-boxSz/2-2);if(tool)drawToolIcon(tool.id,bx+boxSz/2,iy,boxSz*0.7);if(toolCooldown>0){const frac=toolCooldown/TOOL_COOLDOWN;const cx=bx+boxSz/2,cy=iy,rad=boxSz*0.5;ctx.fillStyle='rgba(10,13,32,0.55)';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2+frac*Math.PI*2);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(197,202,233,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2+frac*Math.PI*2);ctx.stroke();}};drawPocket('A',player.pocket[0],GW-T*0.5-boxSz*2-6);drawPocket('B',player.pocket[1],GW-T*0.5-boxSz);}
function renderDialogue(oy){if(!dialogue)return;const boxW=GW-T*2,boxH=T*2.5,boxX=T,boxY=oy+T*0.5;ctx.fillStyle='rgba(13,13,32,0.92)';ctx.fillRect(boxX,boxY,boxW,boxH);ctx.strokeStyle=NES.dialogBd;ctx.lineWidth=1.5;ctx.strokeRect(boxX+1,boxY+1,boxW-2,boxH-2);const lines=dialogue.text.split('\n');const fs=Math.max(6,Math.floor(T*0.5));ctx.font=fs+'px "Press Start 2P",monospace';ctx.fillStyle=NES.white;ctx.textAlign='left';let shown=Math.floor(dialogue.reveal);for(let i=0;i<lines.length;i++){if(shown<=0)break;const seg=lines[i].slice(0,shown);ctx.fillText(seg,boxX+T*0.5,boxY+T*0.7+i*(fs+4));shown-=lines[i].length;}if(dialogue.reveal<dialogue.len&&frame%20<10){ctx.fillStyle=NES.dialogBd;ctx.fillText('_',boxX+T*0.5,boxY+T*0.7+(lines.length-1)*(fs+4));}if(frame%40<25){ctx.fillStyle=NES.hudDim;ctx.font=Math.floor(fs*0.7)+'px "Press Start 2P",monospace';ctx.textAlign='right';ctx.fillText('START ▶',boxX+boxW-T*0.3,boxY+boxH-T*0.25);}}
function renderTitle(){ctx.fillStyle=NES.bg;ctx.fillRect(0,0,GW,GH);}
function renderComplete(){completionTimer++;ctx.fillStyle=NES.bg;ctx.fillRect(0,0,GW,GH);const fs=Math.max(8,Math.floor(T*0.6));ctx.globalAlpha=Math.min(1,completionTimer/60);ctx.font=fs*1.5+'px "Press Start 2P",monospace';ctx.fillStyle=NES.dialogBd;ctx.textAlign='center';ctx.fillText('DISTRICT 01',GW/2,GH*0.32);ctx.font=fs+'px "Press Start 2P",monospace';ctx.fillStyle=NES.termOn;ctx.fillText('ROUTE VALIDATED',GW/2,GH*0.42);ctx.font=fs*0.7+'px "Press Start 2P",monospace';ctx.fillStyle=NES.hud;ctx.fillText('YOU PROVED THE FIX.',GW/2,GH*0.52);ctx.fillStyle=NES.hudDim;ctx.fillText('GREEN WAS NOT ENOUGH.',GW/2,GH*0.58);if(completionTimer>120){ctx.fillStyle=NES.hud;ctx.font=fs*0.6+'px "Press Start 2P",monospace';if(frame%40<25)ctx.fillText('PRESS START',GW/2,GH*0.74);}ctx.globalAlpha=1;}
function toggleTTLog(){
  const panel=document.getElementById('ttpanel'); if(!panel)return;
  const exp=panel.classList.toggle('expanded');
  panel.classList.toggle('collapsed',!exp);
  const tog=document.getElementById('tt-toggle');
  if(tog)tog.textContent=exp?'TAP TO COLLAPSE ▴':'TAP TO EXPAND ▾';
  renderTTLog();
}
function showPlayUI(on){const bar=document.getElementById('toolbar'),tt=document.getElementById('ttpanel');if(on){bar.classList.add('show');tt.classList.add('show');}else{bar.classList.remove('show');tt.classList.remove('show');}}
function gameLoop(){frame++;
  switch(gameState){
    case'TITLE':if(wasPressed('start')||wasPressed('A')){startGame();}break;
    case'PLAY':
      if(wasPressed('start')){if(dialogue)dialogue=null;else{gameState='PAUSED';break;}}
      updateFade();if(!(fade.active&&fade.phase==='out')){updatePlayer();updateScouts();}updateDialogue();break;
    case'PAUSED':if(wasPressed('start'))gameState='PLAY';break;
    case'COMPLETE':if(completionTimer>120&&(wasPressed('start')||wasPressed('A'))){gameState='PLAY';player.stability=3;player.checkpoint=null;clearedTiles={};revealedH={};TT.reset();loadRoom('R02');}break;
  }
  // TTRPG: validation is enforced at route doors; manual validation button remains a future patch option.
  render();
  Object.keys(justPressed).forEach(k=>delete justPressed[k]);
  requestAnimationFrame(gameLoop);
}
function startGame(){Audio.init();Audio.resume();Audio.startHum();gameState='PLAY';document.getElementById('title-screen').style.display='none';TT.reset();buildToolbar();showPlayUI(true);loadRoom('R02');}
document.getElementById('title-screen').addEventListener('click',startGame);
document.getElementById('title-screen').addEventListener('touchend',e=>{e.preventDefault();startGame();});
addEventListener('resize',resize);
(function(){const h=document.getElementById('tt-head');if(h){h.addEventListener('click',toggleTTLog);h.addEventListener('touchend',e=>{e.preventDefault();toggleTTLog();});}})();
buildTileset();resize();setupTouch();buildToolbar();bindTTPanelButtons();requestAnimationFrame(gameLoop);
</script>
