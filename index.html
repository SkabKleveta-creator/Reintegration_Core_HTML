 const z=document.getElementById('joyZone'),base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob');
 let active=false,pid=null,ox=0,oy=0;
 function set(nx,ny){joy.left=nx<-.3;joy.right=nx>.3;joy.up=ny<-.3;joy.down=ny>.3;}
 function clearJoy(){joy.left=joy.right=joy.up=joy.down=false;}
 z.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(state!=='PLAY')return;active=true;pid=e.pointerId;z.setPointerCapture&&z.setPointerCapture(pid);const r=z.getBoundingClientRect();ox=e.clientX;oy=e.clientY;base.style.left=(e.clientX-r.left-60)+'px';base.style.bottom=(r.bottom-e.clientY-60)+'px';mv(e);},{passive:false});
 function mv(e){if(!active||e.pointerId!==pid)return;const dx=e.clientX-ox,dy=e.clientY-oy,mag=Math.hypot(dx,dy)||1,rad=46,k=Math.min(mag,rad);knob.style.transform='translate('+(dx/mag*k)+'px,'+(dy/mag*k)+'px)';if(mag<10)clearJoy();else set(dx/mag,dy/mag);}
 z.addEventListener('pointermove',e=>{e.preventDefault();mv(e);},{passive:false});
 function end(e){if(e.pointerId!==pid)return;active=false;pid=null;clearJoy();knob.style.transform='translate(0,0)';base.style.left='34px';base.style.bottom='28px';}
 z.addEventListener('pointerup',end,{passive:false});z.addEventListener('pointercancel',end,{passive:false});
}
bindJoy();
function loop(ts){frame++;update(1);render();if(state==='PLAY'&&frame%12===0)buildTools();for(const k in just)delete just[k];requestAnimationFrame(loop);}window.addEventListener('resize',resize);resize();buildTools();updateHUD();requestAnimationFrame(loop);
</script>
</body>
</html>
