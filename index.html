<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>Reintegration Core — District 01 · 12-Room Corridor Expansion v1.18.10</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#0a0a1a;font-family:'Press Start 2P',monospace;touch-action:pan-y;user-select:none;-webkit-user-select:none;}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%;min-height:100svh;height:auto;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));overflow:visible;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin-top:0;touch-action:none;}

  /* ── Quick Tool Bar (NEW: replaces SELECT-menu detour for access) ── */
  #toolbar{display:none;width:calc(100% - 12px);max-width:760px;margin:10px auto 0;justify-content:center;gap:6px;z-index:14;padding:0 6px;flex-wrap:wrap;flex:0 0 auto;order:30;}
  #toolbar.show{display:flex;}
  .qtool{pointer-events:auto;min-width:62px;background:rgba(20,24,40,0.86);border:1.5px solid rgba(120,130,170,0.4);border-radius:6px;padding:5px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-tap-highlight-color:transparent;}
  .qtool .qn{font-size:7px;color:#c5cae9;letter-spacing:.5px;}
  .qtool .qd{font-size:5px;color:rgba(197,202,233,0.45);line-height:1.25;text-align:center;}
  .qtool:active{background:rgba(91,155,213,0.3);}
  .qtool.eqA{border-color:#5b9bd5;box-shadow:0 0 6px rgba(91,155,213,0.5);}
  .qtool.eqB{border-color:#ff5a5a;box-shadow:0 0 6px rgba(255,90,90,0.5);}
  .qtool.fired{background:#fff;}
  .qtool .slot{font-size:5px;padding:0 3px;border-radius:2px;margin-top:1px;}
  .qtool .slot.A{background:#5b9bd5;color:#06121f;}
  .qtool .slot.B{background:#ff5a5a;color:#1f0606;}

  /* ── Tabletop side panel: intent log + validate (NEW) ── */
  /* Inline panel: flows directly under the canvas, never overlaps play or controls. */
  #ttpanel{display:none!important;width:calc(100% - 12px);max-width:760px;margin:8px auto 0;background:rgba(13,15,30,0.92);border:1.5px solid rgba(91,155,213,0.4);border-radius:8px;flex-direction:column;overflow:hidden;flex:0 0 auto;order:20;}
  #ttpanel.show{display:none!important;}
  #tt-head{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid rgba(91,155,213,0.25);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  #tt-head h3{font-size:7px;color:#8ab4f8;letter-spacing:1px;margin:0;}
  #tt-toggle{font-size:6px;color:rgba(130,180,248,0.7);border:1px solid rgba(91,155,213,0.4);border-radius:3px;padding:2px 6px;}
  #ttobjective{font-size:6px;color:rgba(252,231,110,0.9);padding:5px 8px;line-height:1.45;border-bottom:1px solid rgba(91,155,213,0.15);}
  #ttactions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px 8px;border-bottom:1px solid rgba(91,155,213,0.15);}
  .ttact{font-family:'Press Start 2P',monospace;font-size:5px;line-height:1.3;color:#d9ecff;background:rgba(20,24,40,0.86);border:1px solid rgba(91,155,213,0.45);border-radius:4px;padding:6px 4px;min-height:30px;-webkit-tap-highlight-color:transparent;}
  .ttact:active{background:rgba(91,155,213,0.28);}
  .ttact.on{border-color:#69f0ae;color:#b8ffe9;box-shadow:0 0 6px rgba(105,240,174,0.35);}
  #ttprocedure{display:none;padding:5px 8px;border-bottom:1px solid rgba(91,155,213,0.15);background:rgba(6,10,20,0.42);}
  #ttpanel.expanded #ttprocedure{display:block;}
  #ttprocedure .pcard-title{font-size:6px;color:#69f0ae;letter-spacing:.6px;margin-bottom:4px;}
  #ttprocedure .pcard-line{font-size:5.5px;line-height:1.45;color:rgba(220,235,255,0.82);margin-bottom:3px;}
  #ttprocedure b{color:#fce76e;font-weight:normal;}
  /* Collapsed: show only last 2-3 lines (no scroll). Expanded: full scrollable history. */
  #ttlog{padding:4px 8px;display:flex;flex-direction:column;gap:3px;}
  #ttpanel.collapsed #ttlog{max-height:none;overflow:visible;}
  #ttpanel.expanded #ttlog{max-height:30vh;overflow-y:auto;}
  .ttline{font-size:6px;line-height:1.4;color:rgba(200,210,235,0.8);border-left:2px solid #2E6F8E;padding-left:5px;}
  .ttline.good{border-color:#69f0ae;color:#b8ffe9;}
  .ttline.bad{border-color:#ff5252;color:#ffb3b3;}
  .ttline.judge{border-color:#fce76e;color:#fce76e;}
  #ttlog::-webkit-scrollbar{width:4px;}
  #ttlog::-webkit-scrollbar-thumb{background:#243140;border-radius:2px;}

  #touch{display:none;position:relative;bottom:auto;left:auto;width:calc(100% - 16px);max-width:760px;margin:12px auto 0;padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px));gap:8px;justify-content:space-between;align-items:flex-end;z-index:10;pointer-events:none;order:40;}
  #touch.show{display:flex;}
  .tpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:min(36vw,156px);height:min(36vw,156px);gap:4px;pointer-events:auto;}
  .tbtn{background:rgba(200,200,220,0.12);border:1.5px solid rgba(200,200,220,0.25);border-radius:8px;display:flex;align-items:center;justify-content:center;color:rgba(200,200,220,0.6);font-family:'Press Start 2P',monospace;font-size:9px;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
  .tbtn:active,.tbtn.pressed{background:rgba(200,200,220,0.3);border-color:rgba(200,200,220,0.5);color:#fff;}
  .tbtn.blank{background:transparent;border-color:transparent;pointer-events:none;}
  .abtn{width:min(18vw,76px);height:min(18vw,76px);border-radius:50%;background:rgba(200,200,220,0.12);border:1.5px solid rgba(200,200,220,0.25);display:flex;align-items:center;justify-content:center;color:rgba(200,200,220,0.6);font-family:'Press Start 2P',monospace;font-size:12px;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
  .abtn:active,.abtn.pressed{background:rgba(200,200,220,0.3);border-color:rgba(200,200,220,0.5);color:#fff;}
  #actbtns{display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:auto;}
  #metabtns{display:flex;gap:6px;align-items:center;justify-content:center;pointer-events:auto;position:relative;bottom:auto;left:auto;transform:none;z-index:11;margin:8px auto 0;order:35;}
  .mbtn{padding:6px 14px;background:rgba(200,200,220,0.08);border:1px solid rgba(200,200,220,0.2);border-radius:4px;color:rgba(200,200,220,0.5);font-family:'Press Start 2P',monospace;font-size:6px;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
  .mbtn:active{background:rgba(200,200,220,0.25);color:#fff;}
  #title-screen{position:fixed;top:0;left:0;width:100%;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;background:#0a0a1a;cursor:pointer;}
  #title-screen h1{color:#5b9bd5;font-size:clamp(28px,4.5vw,62px);letter-spacing:4px;margin-bottom:16px;text-align:center;line-height:1.35;text-shadow:0 0 22px rgba(91,155,213,.42);}
  #title-screen h2{color:#8ab4f8;font-size:clamp(12px,1.35vw,20px);letter-spacing:2px;margin-bottom:34px;text-align:center;}
  #title-screen p{color:rgba(200,200,220,0.72);font-size:clamp(10px,1.1vw,16px);animation:blink 1.2s infinite;}
  #title-screen .sub{color:rgba(200,200,220,0.42);font-size:clamp(9px,.95vw,14px);margin-top:24px;line-height:2;letter-spacing:1px;text-align:center;}

  @media (max-width: 768px){
    html,body{height:auto;min-height:100svh;overflow-y:auto;overflow-x:hidden;}
    #wrap{height:auto;min-height:100svh;overflow:visible;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));}
    canvas{margin-top:6px;max-width:calc(100vw - 8px);height:auto;}
    #ttpanel{display:none!important;margin-top:0;}
    #toolbar{margin-top:10px;}
    #touch{margin-top:10px;}
    #metabtns{margin-top:8px;}
    #touch.show{display:flex;}
    #metabtns.show{display:flex;}
    .qtool{min-width:30%;padding:8px 7px 7px;border-radius:9px;}
    .qtool .qn{font-size:9px;}
    .qtool .qd{font-size:6px;}
    #tt-head h3{font-size:10px;}
    #ttobjective{font-size:8px;line-height:1.55;padding:10px 12px;}
    .ttact{font-size:7px;min-height:48px;border-radius:8px;}
    .ttline{font-size:8px;}
    .mbtn{font-size:8px;padding:9px 20px;border-radius:8px;}
  }
</style>
</head>

<div id="wrap">

    <div id="ttprocedure"></div>
    <div id="ttlog"></div>
  </div>
  <div id="title-screen">
    <h1>REINTEGRATION<br>CORE</h1>
    <h2>DISTRICT 01 — 12-ROOM CORRIDOR 1.18.10</h2>

    <div class="sub">DIAGNOSE. CONNECT. VALIDATE.<br>ANCHORS ARE NOT ASSUMPTIONS.</div>

  <div id="toolbar"></div>
  <div id="touch" class="show">
    <div class="tpad">
      <div class="tbtn blank"></div>
      <div class="tbtn" data-key="up">▲</div>
      <div class="tbtn blank"></div>
      <div class="tbtn" data-key="left">◄</div>
      <div class="tbtn blank"></div>
      <div class="tbtn" data-key="right">►</div>
      <div class="tbtn blank"></div>
      <div class="tbtn" data-key="down">▼</div>
      <div class="tbtn blank"></div>
    </div>
    <div id="actbtns">
      <div class="abtn" data-key="b">B</div>
      <div class="abtn" data-key="a">A</div>
    </div>
  </div>
  <div id="metabtns" class="show">
    <div class="mbtn" data-key="start">START</div>
  </div>
</div>

const Audio={
  ctx:null, hum:null, humGain:null, muted:false,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    try{this.ctx=new AC();}catch(e){this.ctx=null;}
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
  beep(freq=440,dur=0.045,type='square',gain=0.035){
    if(this.muted)return;
    this.init(); if(!this.ctx)return;
    const now=this.ctx.currentTime;
    const osc=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,now);
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(gain,now+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now+dur+0.02);
  },
  startHum(){
    if(this.muted)return;
    this.init(); if(!this.ctx||this.hum)return;
    const now=this.ctx.currentTime;
    this.hum=this.ctx.createOscillator();
    this.humGain=this.ctx.createGain();
    this.hum.type='sine'; this.hum.frequency.setValueAtTime(55,now);
    this.humGain.gain.setValueAtTime(0.004,now);
    this.hum.connect(this.humGain); this.humGain.connect(this.ctx.destination);
    this.hum.start(now);
  },
  stopHum(){if(this.hum){try{this.hum.stop();}catch(e){} this.hum=null; this.humGain=null;}},
  toggleHum(){this.muted=!this.muted;if(this.muted)this.stopHum();else this.startHum();},
  tool(id){const map={PULSE:180,SCANNER:520,GRAPPLE:660,SYNC:420,THERMAL:260,CATALYST:300,CHKPT:740,READER:560};this.beep(map[id]||440,0.05,'square',0.03);},
  fail(){this.beep(120,0.12,'sawtooth',0.04);},
  pass(){this.beep(720,0.08,'square',0.035);setTimeout(()=>this.beep(920,0.06,'square',0.03),70);},
  interact(){this.beep(540,0.045,'square',0.025);},
  doorChime(){this.beep(620,0.07,'square',0.03);setTimeout(()=>this.beep(830,0.07,'square',0.025),80);},
  complete(){this.pass();setTimeout(()=>this.beep(1040,0.12,'square',0.035),150);},
  thud(){this.beep(95,0.09,'triangle',0.05);},
  stun(){this.beep(350,0.04,'square',0.03);},
  ladderTick(){this.beep(210,0.018,'square',0.012);}
};

function anchorDist(a){const p=playerCenter();return Math.hypot(a.x-p.x,a.y-p.y);}
function findNearestAnchor(){

  if(bd<GRAPPLE_MIN_DIST)return {anchor:best,dist:bd,reason:'Anchor too close. Near-zero-distance safety guard blocked the hook.'};

function startGrapple(){

  if(found.reason){grappleFailFlash=18;TT.record('HOOK',found.reason+' '+found.anchor.id,'bad');showDialogue('HOOK FAILED.\n'+found.reason.toUpperCase());Audio.fail();return;}

// ── VALIDATION: proof before progress, made digital ──
// A room is proven only when its real state passes. "Green board" never counts as proof.
function countCurrentTiles(chars){
  let n=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<roomWidth();c++){ if(chars.includes(getTile(c,r))) n++; }
  return n;
}
function allRelaysConfirmed(id){
  const relays=RELAY_LAYOUT[id]||[];
  if(!relays.length)return true;
  return relays.every(r=>!!TT.roomState[r.key]);
}
function missingRelayNames(id){
  return (RELAY_LAYOUT[id]||[]).filter(r=>!TT.roomState[r.key]).map(r=>r.name);
}
function validateRoom(){
  if(gameState!=='PLAY')return;
  const id=currentRoom;
  let pass=false, detail='';
  const faults=()=>countCurrentTiles(['X']);
  const cat=()=>countCurrentTiles(['C']);
  const heat=()=>countCurrentTiles(['V','~']);
  const relayDetail=()=>{const m=missingRelayNames(id); return m.length?('Relay '+m.join('/')+' incomplete.'):'';};
  if(id==='R02'){
    const f=faults(); pass = f===0; detail = pass ? 'No faults remain. Route verified clean.' : (f+' fault(s) still live. Not proven.');
  } else if(id==='R03'){
    pass = allRelaysConfirmed(id); detail = pass ? 'Both relays confirmed. Sync is real, not just reported.' : 'Board says SYNCED — but '+relayDetail()+' False green.';
  } else if(id==='R12'){
    pass = !!TT.roomState.R12_scanned; detail = pass ? 'Route mapped and confirmed open.' : 'Route unmapped. SCAN the sector first.';
  } else if(id==='R04'){
    const h=heat(); pass = h===0; detail = pass ? 'All vents cooled. Passage safe.' : (h+' heat source(s) still active.');
  } else if(id==='R05'){
    const c=cat(); pass = c===0; detail = pass ? 'All catalyst blocks cleared.' : (c+' catalyst block(s) remain.');
  } else if(id==='R06'){
    const f=faults(); pass = f===0 && allRelaysConfirmed(id); detail = pass ? 'Faults clear, relays set. Engine route proven.' : (f?f+' fault(s) live. ':'')+relayDetail();
  } else if(id==='R07'){
    pass = player.y <= 4.2 && player.x >= 57; detail = pass ? 'Upper-right shaft exit reached. Vertical route proven.' : 'High right-side shaft exit not reached. Climb up, then cross the cleared upper deck.';
  } else if(id==='R08'){
    const f=faults(), c=cat(), h=heat(); pass = f===0 && c===0 && h===0 && allRelaysConfirmed(id); detail = pass ? 'Mixed obstacles clear and all three relays confirmed.' : (f?f+' fault(s) live. ':'')+(c?c+' catalyst block(s) remain. ':'')+(h?h+' heat source(s) active. ':'')+relayDetail();
  } else if(id==='R09'){
    const f=faults(); pass = f===0 && !!TT.roomState.R09_scanned && allRelaysConfirmed(id); detail = pass ? 'Audit mesh clear, hidden route scanned, relays confirmed.' : (f?f+' fault(s) live. ':'')+(!TT.roomState.R09_scanned?'Hidden route not scanned. ':'')+relayDetail();
  } else if(id==='R10'){
    const h=heat(); pass = h===0 && allRelaysConfirmed(id); detail = pass ? 'Thermal sources cooled and relays confirmed.' : (h?h+' heat source(s) active. ':'')+relayDetail();
  } else if(id==='R11'){
    const f=faults(), c=cat(); pass = f===0 && c===0 && allRelaysConfirmed(id); detail = pass ? 'Catalyst fork clear, faults removed, relays confirmed.' : (f?f+' fault(s) live. ':'')+(c?c+' catalyst block(s) remain. ':'')+relayDetail();
  } else if(id==='R13'){
    const f=faults(), c=cat(), h=heat(); pass = f===0 && c===0 && h===0 && allRelaysConfirmed(id); detail = pass ? 'Final integration route proven. All systems hold.' : (f?f+' fault(s) live. ':'')+(c?c+' catalyst block(s) remain. ':'')+(h?h+' heat source(s) active. ':'')+relayDetail();
  } else {
    detail='No validation procedure for this sector.';
  }
  TT.roomState[id+'_validated']=pass;
  if(pass){ Audio.pass(); TT.push('ROUTE PROVEN ✓ '+detail,'good'); showDialogue('ROUTE HOLDS.\n'+detail); }
  else { Audio.fail(); TT.push('DOOR HELD ✗ '+detail,'bad'); showDialogue('THE DOOR WON\u2019T OPEN.\n'+detail); }
  return pass;
}

  case'SYNC':{const radius=TOOL_RANGE*T*prog*0.5;const a=0.5*(1-prog);ctx.strokeStyle='rgba(0,200,83,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2);ctx.stroke();break;}
  case'THERMAL':{for(let w=0;w<3;w++){const wp=prog-w*0.18;if(wp<=0)continue;const radius=TOOL_RANGE*T*wp;const a=0.4*(1-wp);const wob=Math.sin(frame*0.5+w)*2;ctx.strokeStyle='rgba(255,140,40,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius+wob),0,Math.PI*2);ctx.stroke();}break;}
  case'CATALYST':{const radius=TOOL_RANGE*T*prog;const a=0.45*(1-prog);ctx.strokeStyle='rgba(170,0,255,'+a+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2);ctx.stroke();break;}
  case'READER':{for(let wave=0;wave<3;wave++){const wp=Math.max(0,prog-wave*0.22);if(wp<=0)continue;const r=3.5*T*wp;const a=(0.6*(1-wp))*(1-wave*0.2);ctx.strokeStyle='rgba(0,220,180,'+a+')';ctx.lineWidth=1.5+wave*0.5;ctx.beginPath();ctx.arc(ex,ey,Math.max(0,r),0,Math.PI*2);ctx.stroke();}ctx.fillStyle='rgba(0,220,180,'+(0.5*(1-prog))+')';ctx.beginPath();ctx.arc(ex,ey,T*0.3,0,Math.PI*2);ctx.fill();break;}}}
function renderParticles(){for(const p of particles){const a=Math.max(0,p.life/p.maxLife);switch(p.kind){case'flash':ctx.fillStyle='rgba('+p.color+','+a+')';ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);break;case'spark':case'rise':case'steam':ctx.fillStyle='rgba('+p.color+','+a+')';ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);break;case'reveal':ctx.strokeStyle='rgba('+p.color+','+a+')';ctx.lineWidth=1.5;ctx.strokeRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.fillStyle='rgba('+p.color+','+(a*0.3)+')';ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);break;case'shard':{if(p.rot!==undefined)p.rot+=p.vr||0;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.fillStyle='rgba('+p.color+','+a+')';ctx.beginPath();ctx.moveTo(0,-p.size);ctx.lineTo(p.size*0.7,0);ctx.lineTo(0,p.size);ctx.lineTo(-p.size*0.7,0);ctx.closePath();ctx.fill();ctx.restore();break;}default:ctx.fillStyle='rgba('+p.color+','+a+')';ctx.fillRect(p.x-1,p.y-1,2,2);}}}
function renderCoolTiles(oy){for(const ct of coolTiles){if(ct.room!==currentRoom)continue;const x=ct.c*T,y=oy+ct.r*T,a=ct.timer/24;ctx.fillStyle='rgba(80,140,255,'+(0.5*a)+')';ctx.fillRect(x,y,T,T);ctx.fillStyle='rgba(200,230,255,'+(0.3*a)+')';ctx.fillRect(x,y,T,2);}}
function renderSyncBeam(){if(!syncBeam)return;const a=Math.min(1,syncBeam.timer/30)*0.7;const pulse=0.5+0.5*Math.sin(frame*0.4);const oy=HUD_ROWS*T;const x0=player.x*T,y0=oy+(player.y+PH/2)*T;ctx.strokeStyle='rgba(0,200,83,'+(a*(0.5+0.5*pulse))+')';ctx.lineWidth=2+pulse*1.5;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(syncBeam.x1,syncBeam.y1);ctx.stroke();ctx.strokeStyle='rgba(130,255,180,'+a+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(syncBeam.x1,syncBeam.y1);ctx.stroke();ctx.fillStyle='rgba(130,255,180,'+a+')';ctx.beginPath();ctx.arc(syncBeam.x1,syncBeam.y1,3+pulse*2,0,Math.PI*2);ctx.fill();}
function drawToolIcon(id,cx,cy,sz){const h=sz/2;ctx.save();ctx.translate(cx,cy);ctx.lineWidth=1.5;ctx.lineCap='round';switch(id){case'PULSE':ctx.strokeStyle=NES.fault;ctx.beginPath();ctx.arc(0,0,h*0.5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,h*0.85,0,Math.PI*2);ctx.stroke();break;case'SCANNER':ctx.strokeStyle=NES.glyphLt;ctx.beginPath();ctx.arc(-h*0.2,-h*0.2,h*0.5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(h*0.15,h*0.15);ctx.lineTo(h*0.7,h*0.7);ctx.stroke();break;case'GRAPPLE':ctx.strokeStyle=NES.doorLt;ctx.beginPath();ctx.arc(-h*0.45,-h*0.05,h*0.22,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-h*0.25,0);ctx.lineTo(h*0.55,-h*0.48);ctx.lineTo(h*0.38,-h*0.18);ctx.moveTo(h*0.55,-h*0.48);ctx.lineTo(h*0.15,-h*0.48);ctx.stroke();break;case'SYNC':ctx.strokeStyle=NES.termOn;ctx.beginPath();ctx.arc(-h*0.45,0,h*0.3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(h*0.45,0,h*0.3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-h*0.15,0);ctx.lineTo(h*0.15,0);ctx.stroke();break;case'THERMAL':ctx.strokeStyle=NES.convLt;for(let a=0;a<6;a++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a*Math.PI/3)*h*0.8,Math.sin(a*Math.PI/3)*h*0.8);ctx.stroke();}break;case'CATALYST':ctx.strokeStyle=NES.catLt;ctx.beginPath();ctx.moveTo(0,-h*0.8);ctx.lineTo(h*0.6,0);ctx.lineTo(0,h*0.8);ctx.lineTo(-h*0.6,0);ctx.closePath();ctx.stroke();break;case'CHKPT':ctx.strokeStyle=NES.stab;ctx.beginPath();ctx.moveTo(-h*0.4,-h*0.8);ctx.lineTo(-h*0.4,h*0.8);ctx.stroke();ctx.fillStyle=NES.stab;ctx.beginPath();ctx.moveTo(-h*0.4,-h*0.8);ctx.lineTo(h*0.5,-h*0.45);ctx.lineTo(-h*0.4,-h*0.1);ctx.closePath();ctx.fill();break;case'READER':ctx.strokeStyle='#00dcb4';ctx.beginPath();ctx.arc(0,0,h*0.3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,0,h*0.6,0,Math.PI*2);ctx.stroke();break;default:ctx.strokeStyle=NES.hudDim;ctx.strokeRect(-h*0.5,-h*0.5,h,h);}ctx.restore();}
function renderHUD(){const hudH=HUD_ROWS*T;ctx.fillStyle=NES.hudBg;ctx.fillRect(0,0,GW,hudH);ctx.strokeStyle=NES.dialogBd;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,hudH-0.5);ctx.lineTo(GW,hudH-0.5);ctx.stroke();const fs=Math.max(7,Math.floor(T*0.55));ctx.font=fs+'px "Press Start 2P",monospace';ctx.textAlign='left';ctx.fillStyle=NES.hudDim;ctx.fillText('D01-'+currentRoom+'  '+(Math.floor(cameraX)+1)+'/'+roomWidth(),T*0.5,T*0.95);
  // TTRPG: validated stamp
  if(TT.roomState[currentRoom+'_validated']){ctx.fillStyle=NES.stab;ctx.font=Math.floor(fs*0.85)+'px "Press Start 2P",monospace';ctx.fillText('✓ VALIDATED',T*0.5+fs*5,T*0.95);}
  else{ctx.fillStyle=NES.stabLo;ctx.font=Math.floor(fs*0.85)+'px "Press Start 2P",monospace';ctx.fillText('UNVERIFIED',T*0.5+fs*5,T*0.95);}
  ctx.fillStyle=NES.hud;ctx.font=fs+'px "Press Start 2P",monospace';ctx.fillText('STB',T*0.5,T*2.05);const cellW=fs*1.4,cellH=fs*0.95,cellY=T*1.45,x0=T*0.5+fs*2.8;for(let i=0;i<3;i++){const cx=x0+i*(cellW+4);ctx.strokeStyle=NES.hudDim;ctx.lineWidth=1.5;ctx.strokeRect(cx,cellY,cellW,cellH);ctx.fillStyle=NES.hudDim;ctx.fillRect(cx+cellW,cellY+cellH*0.3,2,cellH*0.4);if(i<player.stability){const low=player.stability===1;ctx.fillStyle=low?NES.stabLo:NES.stab;ctx.fillRect(cx+1.5,cellY+1.5,cellW-3,cellH-3);ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(cx+1.5,cellY+1.5,cellW-3,2);}}
  const boxSz=fs*1.6,iy=hudH*0.5;const drawPocket=(label,tool,bx)=>{ctx.strokeStyle=NES.hudDim;ctx.lineWidth=1;ctx.strokeRect(bx,iy-boxSz/2,boxSz,boxSz);ctx.fillStyle=NES.hudDim;ctx.font=Math.floor(fs*0.7)+'px "Press Start 2P",monospace';ctx.textAlign='left';ctx.fillText(label,bx,iy-boxSz/2-2);if(tool)drawToolIcon(tool.id,bx+boxSz/2,iy,boxSz*0.7);if(toolCooldown>0){const frac=toolCooldown/TOOL_COOLDOWN;const cx=bx+boxSz/2,cy=iy,rad=boxSz*0.5;ctx.fillStyle='rgba(10,13,32,0.55)';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2+frac*Math.PI*2);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(197,202,233,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2+frac*Math.PI*2);ctx.stroke();}};drawPocket('A',player.pocket[0],GW-T*0.5-boxSz*2-6);drawPocket('B',player.pocket[1],GW-T*0.5-boxSz);}
function renderDialogue(oy){if(!dialogue)return;const boxW=GW-T*2,boxH=T*2.5,boxX=T,boxY=oy+T*0.5;ctx.fillStyle='rgba(13,13,32,0.92)';ctx.fillRect(boxX,boxY,boxW,boxH);ctx.strokeStyle=NES.dialogBd;ctx.lineWidth=1.5;ctx.strokeRect(boxX+1,boxY+1,boxW-2,boxH-2);const lines=dialogue.text.split('\n');const fs=Math.max(6,Math.floor(T*0.5));ctx.font=fs+'px "Press Start 2P",monospace';ctx.fillStyle=NES.white;ctx.textAlign='left';let shown=Math.floor(dialogue.reveal);for(let i=0;i<lines.length;i++){if(shown<=0)break;const seg=lines[i].slice(0,shown);ctx.fillText(seg,boxX+T*0.5,boxY+T*0.7+i*(fs+4));shown-=lines[i].length;}if(dialogue.reveal<dialogue.len&&frame%20<10){ctx.fillStyle=NES.dialogBd;ctx.fillText('_',boxX+T*0.5,boxY+T*0.7+(lines.length-1)*(fs+4));}if(frame%40<25){ctx.fillStyle=NES.hudDim;ctx.font=Math.floor(fs*0.7)+'px "Press Start 2P",monospace';ctx.textAlign='right';ctx.fillText('START ▶',boxX+boxW-T*0.3,boxY+boxH-T*0.25);}}
function renderTitle(){ctx.fillStyle=NES.bg;ctx.fillRect(0,0,GW,GH);}
function renderComplete(){completionTimer++;ctx.fillStyle=NES.bg;ctx.fillRect(0,0,GW,GH);const fs=Math.max(8,Math.floor(T*0.6));ctx.globalAlpha=Math.min(1,completionTimer/60);ctx.font=fs*1.5+'px "Press Start 2P",monospace';ctx.fillStyle=NES.dialogBd;ctx.textAlign='center';ctx.fillText('DISTRICT 01',GW/2,GH*0.32);ctx.font=fs+'px "Press Start 2P",monospace';ctx.fillStyle=NES.termOn;ctx.fillText('ROUTE VALIDATED',GW/2,GH*0.42);ctx.font=fs*0.7+'px "Press Start 2P",monospace';ctx.fillStyle=NES.hud;ctx.fillText('YOU PROVED THE FIX.',GW/2,GH*0.52);ctx.fillStyle=NES.hudDim;ctx.fillText('GREEN WAS NOT ENOUGH.',GW/2,GH*0.58);if(completionTimer>120){ctx.fillStyle=NES.hud;ctx.font=fs*0.6+'px "Press Start 2P",monospace';if(frame%40<25)ctx.fillText('PRESS START',GW/2,GH*0.74);}ctx.globalAlpha=1;}
function toggleTTLog(){
  const panel=document.getElementById('ttpanel'); if(!panel)return;
  const exp=panel.classList.toggle('expanded');
  panel.classList.toggle('collapsed',!exp);
  const tog=document.getElementById('tt-toggle');
  if(tog)tog.textContent=exp?'TAP TO COLLAPSE ▴':'TAP TO EXPAND ▾';
  renderTTLog();
}
function showPlayUI(on){const bar=document.getElementById('toolbar'),tt=document.getElementById('ttpanel');if(on){if(bar)bar.classList.add('show');if(tt)tt.classList.add('show');}else{if(bar)bar.classList.remove('show');if(tt)tt.classList.remove('show');}}
function gameLoop(){frame++;
  switch(gameState){
    case'TITLE':if(wasPressed('start')||wasPressed('A')){startGame();}break;
    case'PLAY':
      if(wasPressed('start')){if(dialogue)dialogue=null;else{gameState='PAUSED';break;}}
      updateFade();if(!(fade.active&&fade.phase==='out')){updatePlayer();updateScouts();}updateDialogue();break;
    case'PAUSED':if(wasPressed('start'))gameState='PLAY';break;
    case'COMPLETE':if(completionTimer>120&&(wasPressed('start')||wasPressed('A'))){gameState='PLAY';player.stability=3;player.checkpoint=null;clearedTiles={};revealedH={};TT.reset();loadRoom('R02');}break;
  }
  // TTRPG: validation is enforced at route doors; manual validation button remains a future patch option.
  render();
  Object.keys(justPressed).forEach(k=>delete justPressed[k]);
  requestAnimationFrame(gameLoop);
}
function startGame(){Audio.init();Audio.resume();Audio.startHum();gameState='PLAY';const ts=document.getElementById('title-screen');if(ts)ts.style.display='none';if(document.body&&document.body.focus)document.body.focus();TT.reset();buildToolbar();showPlayUI(true);loadRoom('R02');}
document.getElementById('title-screen').addEventListener('click',startGame);
document.getElementById('title-screen').addEventListener('touchend',e=>{e.preventDefault();startGame();});
addEventListener('resize',resize);
(function(){const h=document.getElementById('tt-head');if(h){h.addEventListener('click',toggleTTLog);h.addEventListener('touchend',e=>{e.preventDefault();toggleTTLog();});}})();
buildTileset();resize();setupTouch();buildToolbar();bindTTPanelButtons();requestAnimationFrame(gameLoop);
</script>
