Reintegration Core code

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reintegration Core — District 01</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Press Start 2P',monospace;touch-action:none;user-select:none;-webkit-user-select:none;}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%;height:100%;position:relative;padding-top:env(safe-area-inset-top,0px);}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin-top:0;}
  #touch{display:none;position:fixed;bottom:0;left:0;width:100%;padding:4px 10px 12px;gap:4px;justify-content:space-between;align-items:flex-end;z-index:10;pointer-events:none;}
  #touch.show{display:flex;}
  .tpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:120px;height:120px;gap:2px;pointer-events:auto;}
  .tbtn{background:rgba(200,200,220,0.12);border:1.5px solid rgba(200,200,220,0.25);border-radius:6px;display:flex;align-items:center;justify-content:center;color:rgba(200,200,220,0.6);font-family:'Press Start 2P',monospace;font-size:7px;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
  .tbtn:active,.tbtn.pressed{background:rgba(200,200,220,0.3);border-color:rgba(200,200,220,0.5);color:#fff;}
  .tbtn.blank{background:transparent;border-color:transparent;pointer-events:none;}
  .abtn{width:52px;height:52px;border-radius:50%;background:rgba(200,200,220,0.12);border:1.5px solid rgba(200,200,220,0.25);display:flex;align-items:center;justify-content:center;color:rgba(200,200,220,0.6);font-family:'Press Start 2P',monospace;font-size:9px;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
  .abtn:active,.abtn.pressed{background:rgba(200,200,220,0.3);border-color:rgba(200,200,220,0.5);color:#fff;}
  #actbtns{display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:auto;}
  #metabtns{display:flex;gap:6px;align-items:center;pointer-events:auto;position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:11;}
  .mbtn{padding:6px 14px;background:rgba(200,200,220,0.08);border:1px solid rgba(200,200,220,0.2);border-radius:4px;color:rgba(200,200,220,0.5);font-family:'Press Start 2P',monospace;font-size:6px;pointer-events:auto;-webkit-tap-highlight-color:transparent;}
  .mbtn:active{background:rgba(200,200,220,0.25);color:#fff;}
  #title-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;background:#0a0a1a;cursor:pointer;}
  #title-screen h1{color:#5b9bd5;font-size:11px;letter-spacing:2px;margin-bottom:6px;text-align:center;line-height:1.8;}
  #title-screen h2{color:#8ab4f8;font-size:7px;letter-spacing:1px;margin-bottom:30px;}
  #title-screen p{color:rgba(200,200,220,0.5);font-size:7px;animation:blink 1.2s infinite;}
  #title-screen .sub{color:rgba(200,200,220,0.3);font-size:6px;margin-top:20px;line-height:2;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
  #toolkit-overlay{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(6,6,16,0.88);z-index:50;flex-direction:column;align-items:center;justify-content:center;}
  #toolkit-overlay.show{display:flex;}
  #tk-panel{position:relative;background:linear-gradient(180deg,#16182a 0%,#0d0f1e 100%);border:3px solid #3a3a4a;border-radius:6px;padding:18px 16px 14px;width:min(90%,340px);box-shadow:0 0 0 2px #0a0a1a,0 8px 30px rgba(0,0,0,0.7);transform:translateY(18px);opacity:0;transition:transform .18s ease,opacity .18s ease;}
  #toolkit-overlay.show #tk-panel{transform:translateY(0);opacity:1;}
  #toolkit-overlay.closing #tk-panel{transform:translateY(30px);opacity:0;}
  /* riveted corners */
  #tk-panel::before,#tk-panel::after{content:'';position:absolute;width:6px;height:6px;background:#5a5a6c;border-radius:50%;box-shadow:inset 0 0 0 1px #2a2a38;}
  #tk-panel::before{top:5px;left:5px;box-shadow:inset 0 0 0 1px #2a2a38, 318px 0 #5a5a6c;}
  #tk-panel::after{bottom:5px;left:5px;box-shadow:inset 0 0 0 1px #2a2a38, 318px 0 #5a5a6c;}
  #tk-header{color:#8ab4f8;font-size:8px;letter-spacing:1px;text-align:center;margin-bottom:4px;}
  #tk-sub{color:#fce76e;font-size:6px;letter-spacing:1px;text-align:center;margin-bottom:12px;}
  .tk-card{position:relative;display:flex;align-items:center;gap:10px;padding:7px 9px;margin:5px 0;border:1.5px solid rgba(120,120,150,0.3);border-radius:4px;background:rgba(40,44,66,0.5);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .08s;}
  .tk-card:hover,.tk-card:active{background:rgba(91,155,213,0.18);}
  .tk-card.cursor{border-color:#fce76e;background:rgba(252,231,110,0.08);animation:tkpulse 0.9s infinite;}
  @keyframes tkpulse{0%,100%{box-shadow:0 0 4px 0 rgba(252,231,110,0.4);}50%{box-shadow:0 0 10px 2px rgba(252,231,110,0.8);}}
  .tk-card.eqA{box-shadow:0 0 8px 1px rgba(91,155,213,0.7);border-color:#5b9bd5;}
  .tk-card.eqB{box-shadow:0 0 8px 1px rgba(255,90,90,0.7);border-color:#ff5a5a;}
  .tk-card.eqAB{box-shadow:0 0 8px 1px rgba(170,120,255,0.7);border-color:#aa78ff;}
  .tk-card.flash{background:#fff !important;}
  .tk-ico{width:26px;height:26px;flex:0 0 26px;}
  .tk-meta{flex:1;text-align:left;}
  .tk-name{color:#e8eaf6;font-size:7px;margin-bottom:3px;}
  .tk-desc{color:rgba(200,200,220,0.55);font-size:6px;line-height:1.5;}
  .tk-badge{font-size:6px;padding:2px 4px;border-radius:3px;font-family:'Press Start 2P',monospace;}
  .tk-badge.A{background:#5b9bd5;color:#06121f;}
  .tk-badge.B{background:#ff5a5a;color:#1f0606;}
  #tk-footer{display:flex;gap:8px;justify-content:center;margin-top:12px;}
  .tk-slot{display:flex;align-items:center;gap:5px;border:1px solid rgba(120,120,150,0.3);border-radius:3px;padding:4px 7px;}
  .tk-slot svg{width:16px;height:16px;}
  .tk-slot .lbl{font-size:6px;}
  .tk-hint{color:rgba(200,200,220,0.35);font-size:6px;margin-top:9px;text-align:center;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="title-screen">
    <h1>REINTEGRATION<br>CORE</h1>
    <h2>DISTRICT 01 — LOGISTICS</h2>
    <p>PRESS START</p>
    <div class="sub">ROUTES STILL MOVE.<br>PURPOSE DOES NOT.</div>
  </div>
  <div id="toolkit-overlay">
    <div id="tk-panel">
      <div id="tk-header">MAINTENANCE TOOLKIT</div>
      <div id="tk-sub" class="tk-sub">SELECT POCKET A</div>
      <div id="tk-list"></div>
      <div id="tk-footer"></div>
      <div class="tk-hint">TAP TOOL / PRESS A OR B</div>
    </div>
  </div>
  <div id="touch" class="show">
    <div class="tpad">
      <div class="tbtn blank"></div>
      <div class="tbtn" data-key="up">▲</div>
      <div class="tbtn blank"></div>
      <div class="tbtn" data-key="left">◄</div>
      <div class="tbtn blank"></div>
      <div class="tbtn" data-key="right">►</div>
      <div class="tbtn blank"></div>
      <div class="tbtn" data-key="down">▼</div>
      <div class="tbtn blank"></div>
    </div>
    <div id="actbtns">
      <div class="abtn" data-key="b">B</div>
      <div class="abtn" data-key="a">A</div>
    </div>
  </div>
  <div id="metabtns" class="show">
    <div class="mbtn" data-key="select">SELECT</div>
    <div class="mbtn" data-key="start">START</div>
  </div>
</div>

const Audio = {
  ctx:null, master:null, hum:null, humGain:null, humOn:true, ready:false,
  init(){
    if(this.ready)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=0.5; this.master.connect(this.ctx.destination);
      this.ready=true;
    }catch(e){ this.ready=false; }
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  // Core blip: NES-style square/triangle with quick envelope.
  tone(freq,dur,type='square',vol=0.25,when=0){
    if(!this.ready)return;
    const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(); const g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  // Pitch slide (for thuds, stuns).
  slide(f0,f1,dur,type='square',vol=0.3){
    if(!this.ready)return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(); const g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol=0.3,filterFreq=800){
    if(!this.ready)return;
    const t=this.ctx.currentTime; const n=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterFreq;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t); src.stop(t+dur+0.02);
  },
  // ── Distinct tone per tool ──
  tool(id){
    this.resume();
    switch(id){
      case'PULSE':    this.tone(660,0.08,'square',0.22); this.tone(990,0.07,'square',0.18,0.05); break;
      case'SCANNER':  this.tone(880,0.06,'triangle',0.2); this.tone(1320,0.06,'triangle',0.18,0.04); break;
      case'SYNC':     this.tone(523,0.07,'sine',0.22); this.tone(784,0.09,'sine',0.2,0.06); break;
      case'THERMAL':  this.slide(500,180,0.18,'sawtooth',0.18); break;
      case'CATALYST': this.tone(440,0.05,'square',0.2); this.tone(370,0.08,'square',0.2,0.05); break;
      case'CHKPT':    this.tone(659,0.07,'sine',0.22); this.tone(988,0.1,'sine',0.2,0.07); break;
      // Reader: low descending sine sweep — distinct from Scanner's bright triangle.
      case'READER':   this.tone(440,0.04,'sine',0.16); this.tone(330,0.10,'sine',0.18,0.05); this.tone(220,0.14,'sine',0.16,0.12); break;
      default:        this.tone(600,0.07,'square',0.2);
    }
  },

// ═══════════════════════════════════════════════════════════════
// PIXEL-ART TILESET (generated in code, blitted at runtime)
// Each tile is authored on a 16x16 grid. Animated types hold
// multiple frames laid out horizontally. A small helper draws
// "pixels" as filled rects so art is crisp and nearest-neighbor
// scales cleanly via image-rendering:pixelated.
// ═══════════════════════════════════════════════════════════════
const TILE_PX = 16;
// Frame counts per animated tile type (1 = static).
const TILE_FRAMES = { '#':1,'_':1,'L':1,'D':2,'S':4,'G':3,'X':2,'C':4,'V':2,'~':3,'=':4,'<':4,'H':1 };
const TILE_ORDER = ['#','_','L','D','S','G','X','C','V','~','=','<','H'];
let tileset=null, tileIndex={};

function buildTileset(){
  // Layout: each tile type gets a row; frames go left-to-right.
  const maxFrames=Math.max(...Object.values(TILE_FRAMES));
  const cols=maxFrames, rows=TILE_ORDER.length;
  const oc=document.createElement('canvas');
  oc.width=cols*TILE_PX; oc.height=rows*TILE_PX;
  const g=oc.getContext('2d');
  TILE_ORDER.forEach((t,row)=>{
    tileIndex[t]={row, frames:TILE_FRAMES[t]};
    for(let fr=0;fr<TILE_FRAMES[t];fr++){
      const ox=fr*TILE_PX, oy=row*TILE_PX;
      drawTileArt(g,t,fr,ox,oy);
    }
  });
  tileset=oc;
}

// Authoring each tile's pixel art on the 16px grid.
function drawTileArt(g,t,fr,ox,oy){
  const P=(px,py,w,h,c)=>{ g.fillStyle=c; g.fillRect(ox+px,oy+py,w,h); };
  switch(t){
    case'#': { // Brick: base + offset courses + mortar + depth
      P(0,0,16,16,NES.wall);
      // three brick courses, alternating offset
      for(let cy=0;cy<3;cy++){
        const by=cy*5+1, off=(cy%2)?4:0;
        for(let bx=-off;bx<16;bx+=8){
          P(bx,by,7,4,NES.wall);              // brick face
          P(bx,by,7,1,NES.wallLt);            // top highlight
          P(bx,by,1,4,NES.wallLt);            // left highlight
          P(bx,by+3,7,1,'rgba(0,0,0,0.30)');  // bottom shadow
          P(bx+6,by,1,4,'rgba(0,0,0,0.30)');  // right shadow
        }
      }
      // mortar grid
      P(0,0,16,1,'rgba(0,0,0,0.25)');
      break; }
    case'_': { // Riveted metal platform (top 0.4 of tile = ~7px)
      P(0,0,16,7,NES.plat);
      P(0,0,16,2,NES.platLt);                 // lit top
      P(0,6,16,1,'rgba(0,0,0,0.35)');         // under-shadow
      for(let rx=2;rx<16;rx+=5){ P(rx,3,2,2,NES.platLt); P(rx+1,4,1,1,'rgba(0,0,0,0.4)'); } // bolts
      break; }
    case'L': { // Ladder rails + rungs
      P(2,0,2,16,NES.ladder); P(11,0,2,16,NES.ladder);
      P(3,0,1,16,'rgba(0,0,0,0.3)'); P(12,0,1,16,'rgba(0,0,0,0.3)');
      for(let i=0;i<4;i++){ P(2,i*4+1,11,2,NES.ladRng); }
      break; }
    case'D': { // Industrial hatch, yellow warning stripe; 2 frames (lit panels toggle)
      P(1,0,14,16,NES.door);
      P(1,0,14,2,NES.doorLt); P(1,14,14,2,'rgba(0,0,0,0.35)');
      // warning stripe (diagonal hazard)
      for(let i=-16;i<16;i+=4){ P(Math.max(1,i),7,2,3,'rgba(0,0,0,0.45)'); }
      // window panels — brighten on frame 1
      const lit = fr===1?NES.doorLt:'rgba(252,231,110,0.65)';
      P(3,2,4,5,lit); P(9,2,4,5,lit);
      P(3,9,10,4,'rgba(252,231,110,0.5)');
      // rivets
      P(2,1,1,1,NES.doorLt); P(13,1,1,1,NES.doorLt); P(2,14,1,1,NES.doorLt); P(13,14,1,1,NES.doorLt);
      break; }
    case'S': { // CRT terminal; 4 frames roll a scanline + flicker brightness
      P(2,2,12,13,NES.termOff);
      P(2,2,12,1,'rgba(0,0,0,0.5)');
      const bright=[0.7,0.85,1.0,0.85][fr];
      P(3,4,10,8,'rgba(0,200,83,'+bright+')');
      // static scanlines
      for(let ly=4;ly<12;ly+=2){ P(3,ly,10,1,'rgba(0,0,0,0.28)'); }
      // rolling bright line per frame
      const roll=4+fr*2; P(3,roll,10,1,'rgba(130,255,180,0.7)');
      // bezel feet
      P(4,15,2,1,NES.termOff); P(10,15,2,1,NES.termOff);
      break; }
    case'G': { // Data node; 3 frames pulse inner ring brightness
      const cx=8,cy=8;
      // node core
      g.fillStyle=NES.glyph; g.beginPath(); g.arc(ox+cx,oy+cy,5,0,Math.PI*2); g.fill();
      const ring=[0.4,0.7,1.0][fr];
      g.strokeStyle='rgba(130,177,255,'+ring+')'; g.lineWidth=1.5;
      g.beginPath(); g.arc(ox+cx,oy+cy,6.5,0,Math.PI*2); g.stroke();
      // exclamation
      P(7,5,2,5,NES.glyphLt); P(7,11,2,2,NES.glyphLt);
      break; }
    case'X': { // Cracked sparking junction box; 2 frames flicker body
      P(2,2,12,12, fr===0?NES.fault:NES.faultDk);
      P(2,2,12,1,'rgba(255,255,255,0.25)');
      // crack X
      g.strokeStyle='rgba(255,255,255,0.75)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(ox+4,oy+4); g.lineTo(ox+12,oy+12); g.moveTo(ox+12,oy+4); g.lineTo(ox+4,oy+12); g.stroke();
      // bolt heads
      P(2,2,2,2,NES.faultDk); P(12,2,2,2,NES.faultDk); P(2,12,2,2,NES.faultDk); P(12,12,2,2,NES.faultDk);
      break; }
    case'C': { // Purple crystal; 4 frames sweep an inner shimmer
      P(0,0,16,16,NES.catalyst);
      g.fillStyle=NES.catLt;
      g.beginPath(); g.moveTo(ox+8,oy+1); g.lineTo(ox+14,oy+8); g.lineTo(ox+8,oy+15); g.lineTo(ox+2,oy+8); g.closePath(); g.fill();
      g.fillStyle='rgba(0,0,0,0.3)';
      g.beginPath(); g.moveTo(ox+8,oy+5); g.lineTo(ox+11,oy+8); g.lineTo(ox+8,oy+11); g.lineTo(ox+5,oy+8); g.closePath(); g.fill();
      // shimmer column position per frame
      const sx=[3,6,9,12][fr]; P(sx,0,1,16,'rgba(255,255,255,0.6)');
      break; }
    case'V': { // Grated vent opening; 2 frames (idle / emitter glow)
      P(0,0,16,7,NES.plat); P(0,0,16,2,NES.platLt);
      if(fr===1){ P(4,1,8,4,NES.vent); P(5,2,6,2,NES.ventLt); }
      else { P(4,2,8,2,NES.hudDim); }
      // grate bars
      for(let gx=4;gx<12;gx+=2){ P(gx,1,1,4,'rgba(0,0,0,0.4)'); }
      break; }
    case'~': { // Heat plume base shimmer; 3 frames shift hue band
      const a=[0.5,0.35,0.45][fr];
      P(0,0,16,16,'rgba(255,61,0,'+a+')');
      P(2,2,12,12,'rgba(255,'+(110+fr*20)+',64,'+(a*0.8)+')');
      break; }
    case'=': { // Conveyor right; 4 frames march arrows
      P(0,0,16,7,NES.plat); P(0,0,16,2,NES.platLt);
      P(0,6,16,3,NES.conv);
      const aoff=fr*4;
      for(let axx=-4;axx<16;axx+=8){ const a=((axx+aoff)%16+16)%16; P(a,6,3,3,NES.convArr); P(a+1,7,2,1,NES.conv); }
      break; }
    case'<': { // Conveyor left; 4 frames march arrows reverse
      P(0,0,16,7,NES.plat); P(0,0,16,2,NES.platLt);
      P(0,6,16,3,NES.convLt);
      const aoff=fr*4;
      for(let axx=-4;axx<16;axx+=8){ const a=((16-(axx+aoff))%16+16)%16; P(a,6,3,3,NES.convArr); P(a-1,7,2,1,NES.convLt); }
      break; }
    case'H': { // Hidden shimmer — faint; near-transparent so it barely reads
      P(0,0,16,16,'rgba(90,90,140,0.10)');
      break; }
  }
}

const SPEED=0.085, CLIMB=0.075, GRAVITY=0.045, MAX_FALL=0.4;
const CONV_FORCE=0.035, IFRAMES=60, SCOUT_SPEED=0.028, VENT_CYCLE=180, SYNC_TIMER=300;
const TOOL_RANGE=3, TOOL_COOLDOWN=20, COYOTE=6;

// ─── TILE QUERIES ────────────────────────────────────────────
function getTile(c,r){ if(c<0||c>=COLS||r<0||r>=ROWS)return '#'; return roomTiles[r][c]; }
// Solid: blocks movement from all sides.
function isWall(c,r){ return getTile(c,r)==='#'; }
// Catalyst blocks behave as solid until cleared.
function isBlockSolid(c,r){ const t=getTile(c,r); return t==='#'||t==='C'; }
// Solid-top: stand on from above only (platforms, conveyors, cooled vents stored as '_').
function isSolidTop(c,r){ const t=getTile(c,r); return t==='_'||t==='='||t==='<'; }
// Ladder climb-volume.
function isLadder(c,r){ return getTile(c,r)==='L'; }
function isDoor(c,r){ return getTile(c,r)==='D'; }
function ventActivePhase(){ return Math.floor(ventCycle/(VENT_CYCLE/2))===0; }
function isHazardTile(c,r){
  const t=getTile(c,r);
  if(t==='X') return true;
  if(t==='~'||t==='V') return ventActivePhase();
  return false;
}

// ─── ROOM LOAD ───────────────────────────────────────────────
function loadRoom(roomId, entryCol, entryRow){
  currentRoom=roomId;
  const src=ROOM_MAPS[roomId]; if(!src)return;
  roomTiles=src.map(row=>row.split(''));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const k=roomId+'_'+c+'_'+r;
    if(clearedTiles[k]){const ch=roomTiles[r][c];
      if(ch==='X'||ch==='C')roomTiles[r][c]='.'; if(ch==='V')roomTiles[r][c]='_';}
    if(revealedH[k]&&roomTiles[r][c]==='H')roomTiles[r][c]='_';
  }
  if(entryCol!==undefined){
    player.x=entryCol; player.y=entryRow;
    if(entryCol===0)player.x=1.6; if(entryCol===31)player.x=29.4;
  } else { player.x=2; player.y=27; }
  player.vy=0; player.vx=0; player.onLadder=false; player.coyote=0;
  snapToFloor();
  scouts=[];
  if(roomId==='R06'){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
      if(src[r][c]==='E')scouts.push(createScout(c,r));
  }
  if(roomId==='R03'){
    const bot=createScout(3,15); bot.kind='patrol'; bot.leftBound=2; bot.rightBound=5; bot.x=3;
    scouts.push(bot);
    scouts.push(createDrone(11,16,11));
  }
  // R08: one patrol bot on the lower platform near the conveyor gate
  if(roomId==='R08'){
    const bot=createScout(15,23); bot.kind='patrol'; bot.leftBound=9; bot.rightBound=22; bot.x=15;
    scouts.push(bot);
  }
  // R11: two patrol bots on the cargo floor lane (cols 9-22, row 22)
  if(roomId==='R11'){
    const src=ROOM_MAPS['R11'];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
      if(src[r][c]==='E')scouts.push(createScout(c,r));
  }
  // R12: scanner drone guards the upper sync section between the two terminals
  if(roomId==='R12'){
    scouts.push(createDrone(12,17,11));
  }
  syncState={active:false,termA:false,termB:false,timer:0};
  particles=[]; coolTiles=[]; syncBeam=null; toolEffect=null;
  showDialogue(ROOM_DIALOGUE[roomId]||'');
}

function snapToFloor(){
  let pc=Math.round(player.x);
  for(let r=Math.floor(player.y);r<ROWS;r++){
    if(isWall(pc,r)||isSolidTop(pc,r)){ player.y=r-PH; player.onGround=true; return; }
  }
}

// ─── SCOUTS ──────────────────────────────────────────────────
function createScout(spawnCol,spawnRow){
  const src=ROOM_MAPS[currentRoom];
  let floorRow=spawnRow;
  for(let r=spawnRow;r<ROWS;r++){ const t=src[r][spawnCol]; if(t==='_'||t==='#'){floorRow=r-1;break;} }
  const standable=(c)=>{ const below=src[floorRow+1]?src[floorRow+1][c]:'#'; const here=src[floorRow][c];
    return here!=='#'&&here!=='L'&&(below==='_'||below==='#'||below==='='); };
  let lb=spawnCol, rb=spawnCol;
  for(let c=spawnCol-1;c>=0;c--){ if(!standable(c))break; lb=c; }
  for(let c=spawnCol+1;c<COLS;c++){ if(!standable(c))break; rb=c; }
  return {x:spawnCol,y:floorRow-(PH-1),dir:1,kind:'patrol',state:'PATROL',stunTimer:0,recoveryTimer:0,leftBound:lb,rightBound:rb,animFrame:0,hitLatch:false};
}
// Scanner Drone: hovers a short horizontal path at a fixed platform row. No gravity.
// Reuses the scout state machine (PATROL/STUNNED/RECOVERY) so Pulse still stuns it.
function createDrone(leftCol,rightCol,row){
  const baseY=row-(PH-1)-1.0; // float just above the platform surface
  return {x:leftCol,y:baseY,baseY:baseY,dir:1,kind:'drone',state:'PATROL',stunTimer:0,recoveryTimer:0,
          leftBound:leftCol,rightBound:rightCol,animFrame:0,bob:0,hitLatch:false};
}
function updateScouts(){
  for(const s of scouts){
    switch(s.state){
      case'PATROL':
        if(s.kind==='drone'){
          // Hover horizontally; gentle vertical bob for readability. Slightly slower than patrol.
          s.x+=SCOUT_SPEED*0.85*s.dir;
          if(s.x<=s.leftBound){s.x=s.leftBound;s.dir=1;}
          if(s.x>=s.rightBound){s.x=s.rightBound;s.dir=-1;}
          s.bob=(s.bob||0)+0.06;
          s.y=s.baseY+Math.sin(s.bob)*0.18;
        } else {
          s.x+=SCOUT_SPEED*s.dir;
          if(s.x<=s.leftBound){s.x=s.leftBound;s.dir=1;}
          if(s.x>=s.rightBound){s.x=s.rightBound;s.dir=-1;}
        }
        break;
      case'STUNNED': s.stunTimer--; if(s.stunTimer<=0){s.state='RECOVERY';s.recoveryTimer=40;} break;
      case'RECOVERY': s.recoveryTimer--; if(s.recoveryTimer<=0)s.state='PATROL'; break;
    }
    s.animFrame=(s.animFrame+0.05)%2;
  }
}
function scoutContactCheck(){
  if(player.iFrames>0)return;
  for(const s of scouts){
    if(s.state==='STUNNED')continue;
    if(Math.abs(s.x-player.x)<0.7 && Math.abs(s.y-player.y)<0.9){ hitPlayer(); return; }
  }
}

// ─── PLAYER UPDATE (rewritten collision core) ────────────────
function updatePlayer(){
  if(gameState!=='PLAY')return;
  player.animTimer++; if(player.animTimer>10){player.animTimer=0;player.animFrame=(player.animFrame+1)%4;}
  if(player.iFrames>0)player.iFrames--;
  if(toolCooldown>0)toolCooldown--;
  if(toolEffect){toolEffect.timer--; if(toolEffect.timer<=0)toolEffect=null;}
  updateParticles();
  if(syncBeam){ syncBeam.timer--; if(syncBeam.timer<=0)syncBeam=null; }
  // Sync beam only persists while a sync window is active or briefly after firing.
  if(syncBeam && !syncState.active && syncBeam.timer<70){ /* allow short fade tail */ }

  const footRow=Math.floor(player.y+PH-0.05);
  const midRow=Math.floor(player.y+PH/2);
  const pc=Math.round(player.x);

  // Ladder availability: player overlaps a ladder tile in the climb column.
  // Sample several points down the body so the check stays true through the whole climb,
  // including near the platform cap where head/feet rows straddle the top rung.
  const ladCol=Math.round(player.x);
  const onLadderTile = isLadder(ladCol,midRow)||isLadder(ladCol,footRow)
                     ||isLadder(ladCol,Math.floor(player.y))||isLadder(ladCol,Math.floor(player.y+PH))
                     ||isLadder(ladCol,Math.floor(player.y+PH/2)+1);

  // Engage on up/down. Do NOT auto-disengage merely because the sample rows miss the
  // ladder for a frame near the top — that was dropping Eli into gravity before the
  // ladder-top mount could ground him. Disengage happens explicitly (grounded or pressed off).
  if(onLadderTile && (isDown('up')||isDown('down'))) player.onLadder=true;
  // Re-enter ladder from a platform top: if standing and pressing Down with a ladder tile
  // directly beneath the feet, grab it so Eli can climb back down (no jump, no fall-through).
  if(!player.onLadder && player.onGround && isDown('down')){
    const fr=Math.floor(player.y+PH);
    const ladderBelow = isLadder(ladCol,fr) || (isSolidTop(ladCol,fr)&&isLadder(ladCol,fr+1));
    if(ladderBelow){
      player.onLadder=true; player.onGround=false;
      // Drop feet just past the platform surface onto the rung below so the climb-down
      // exit doesn't immediately re-ground Eli on the platform he is leaving.
      player.y = (fr+1) - PH + 0.05;
    }
  }

  // ── HORIZONTAL ──
  let dx=0;
  if(isDown('left')){dx=-SPEED;player.facing=-1;}
  if(isDown('right')){dx=SPEED;player.facing=1;}
  // Conveyor force only when grounded. Read the belt at the SUPPORTING row beneath
  // Eli's feet (the tile he stands on), not the air row his feet occupy. The prior
  // footRow (y+PH-0.05) pointed one row too high, so belt force silently never applied.
  if(player.onGround){
    const standRow=Math.floor(player.y+PH+0.05); // row directly under the feet
    const belt=getTile(pc,standRow);
    if(belt==='=')dx+=CONV_FORCE;
    if(belt==='<')dx-=CONV_FORCE;
  }
  let nx=player.x+dx;
  const topR=Math.floor(player.y+0.1), botR=Math.floor(player.y+PH-0.1);
  if(dx<0){
    const lc=Math.floor(nx-PW);
    if(isBlockSolid(lc,topR)||isBlockSolid(lc,botR)||isBlockSolid(lc,midRow)) nx=lc+1+PW;
  } else if(dx>0){
    const rc=Math.floor(nx+PW);
    if(isBlockSolid(rc,topR)||isBlockSolid(rc,botR)||isBlockSolid(rc,midRow)) nx=rc-PW;
  }
  player.x=Math.max(PW, Math.min(COLS-PW, nx));

  // ── VERTICAL ──
  if(player.onLadder){
    player.vy=0;
    if(isDown('up'))player.vy=-CLIMB;
    if(isDown('down'))player.vy=CLIMB;
    if(player.vy!==0){ ladderTickTimer++; if(ladderTickTimer>=12){ Audio.ladderTick(); ladderTickTimer=0; } } else { ladderTickTimer=10; }
    let ny=player.y+player.vy;
    // Block climbing head-first into a solid wall above.
    if(player.vy<0){ const hc=Math.round(player.x), hr=Math.floor(ny); if(isWall(hc,hr))ny=hr+1; }
    player.y=Math.max(0,Math.min(ROWS-PH,ny));
    player.onGround=false;

    const hc=Math.round(player.x);
    const feet=player.y+PH;

    // LADDER-TOP MOUNT (no jump): if the ladder no longer continues above the head and a
    // platform caps the climb column, ground Eli standing on that platform. This is the
    // sole way up at the top, replacing any jump. Robust: fires as soon as feet reach the cap.
    if(player.vy<=0){
      const headRow=Math.floor(player.y);
      const ladderContinuesUp = isLadder(hc,headRow-1)||isLadder(hc,headRow);
      if(!ladderContinuesUp){
        // Find the capping solid-top at/just above the feet and stand on it.
        for(let probe=Math.floor(feet)-1; probe<=Math.floor(feet)+1; probe++){
          if(probe<0)continue;
          if(isLadder(hc,probe))continue;
          if((isSolidTop(hc,probe)||isWall(hc,probe)) && feet<=probe+0.6){
            player.y=probe-PH; player.vy=0; player.onGround=true; player.onLadder=false;
            player.coyote=COYOTE;
            break;
          }
        }
      }
    }

    // CLIMB-DOWN EXIT: if descending and feet reach a floor while the ladder ends below,
    // stand on it rather than passing through.
    if(player.onLadder && player.vy>0){
      const fr=Math.floor(player.y+PH);
      if(!isLadder(hc,fr) && (isSolidTop(hc,fr)||isWall(hc,fr))){
        player.y=fr-PH; player.vy=0; player.onGround=true; player.onLadder=false; player.coyote=COYOTE;
      }
    }

    // Controlled disengage: if Eli has climbed entirely off the ladder (no ladder tile
    // anywhere on his body) and wasn't grounded by a mount, hand him to gravity safely.
    if(player.onLadder){
      const stillOn = isLadder(hc,Math.floor(player.y))||isLadder(hc,Math.floor(player.y+PH/2))
                    ||isLadder(hc,Math.floor(player.y+PH))||isLadder(hc,Math.floor(player.y+PH/2)+1);
      if(!stillOn && !onLadderTile) player.onLadder=false;
    }
  } else {
    player.vy+=GRAVITY; if(player.vy>MAX_FALL)player.vy=MAX_FALL;
    let ny=player.y+player.vy;
    player.onGround=false;
    if(player.vy>=0){
      // Sample three columns across Eli's width for solid-top landing.
      const fr=Math.floor(ny+PH);
      const cols=[Math.floor(player.x-PW+0.02),Math.round(player.x),Math.floor(player.x+PW-0.02)];
      let landed=false;
      for(const cc of cols){
        if(isWall(cc,fr)||isSolidTop(cc,fr)){
          // Only land if feet were above this tile's top last frame (one-way for solid-top).
          const tileTop=fr;
          if(player.y+PH<=tileTop+0.5){ ny=tileTop-PH; player.vy=0; player.onGround=true; landed=true; break; }
        }
      }
      if(!landed && player.coyote>0)player.coyote--;
      if(player.onGround)player.coyote=COYOTE;
    } else {
      const hr=Math.floor(ny);
      const hc=Math.round(player.x);
      if(isWall(hc,hr)){ ny=hr+1; player.vy=0; }
    }
    player.y=Math.max(0,Math.min(ROWS-PH,ny));
  }

  // ── HAZARD (full-body sample) ──
  if(player.iFrames<=0){
    const hcols=[Math.floor(player.x-PW+0.02),Math.round(player.x),Math.floor(player.x+PW-0.02)];
    const hrows=[Math.floor(player.y+0.1),midRow,Math.floor(player.y+PH-0.1)];
    outer: for(const hc of hcols)for(const hr of hrows){ if(isHazardTile(hc,hr)){hitPlayer();break outer;} }
  }
  scoutContactCheck();

  // ── INTERACTION / TOOLS ──
  if(wasPressed('up'))handleInteraction();
  if(wasPressed('A')&&toolCooldown<=0)useTool(0);
  if(wasPressed('B')&&toolCooldown<=0)useTool(1);

  // Sync window.
  if(syncState.active){
    syncState.timer--;
    if(syncState.timer<=0)syncState={active:false,termA:false,termB:false,timer:0};
    if(syncState.termA&&syncState.termB){ showDialogue('RELAY SYNCHRONIZED.\nROUTE RESTORED.'); syncState={active:false,termA:false,termB:false,timer:0}; }
  }
  ventCycle=(ventCycle+1)%VENT_CYCLE;
}

function hitPlayer(){
  player.stability--; player.iFrames=IFRAMES; Audio.thud();
  if(player.stability<=0)resetRoom();
}
function resetRoom(){
  player.stability=3;
  if(player.checkpoint&&player.checkpoint.room===currentRoom){ player.x=player.checkpoint.x; player.y=player.checkpoint.y; }
  else { player.x=2; player.y=27; }
  player.vy=0; player.vx=0; player.onLadder=false; player.iFrames=IFRAMES; player.coyote=0;
  snapToFloor();
  if(currentRoom==='R06'){
    scouts=[]; const src=ROOM_MAPS[currentRoom];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(src[r][c]==='E')scouts.push(createScout(c,r));
  }
  if(currentRoom==='R03'){
    scouts=[];
    const bot=createScout(3,15); bot.kind='patrol'; bot.leftBound=2; bot.rightBound=5; bot.x=3; scouts.push(bot);
    scouts.push(createDrone(11,16,11));
  }
  if(currentRoom==='R08'){
    scouts=[];
    const bot=createScout(15,23); bot.kind='patrol'; bot.leftBound=9; bot.rightBound=22; bot.x=15;
    scouts.push(bot);
  }
  if(currentRoom==='R11'){
    scouts=[]; const src=ROOM_MAPS['R11'];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(src[r][c]==='E')scouts.push(createScout(c,r));
  }
  if(currentRoom==='R12'){
    scouts=[]; scouts.push(createDrone(12,17,11));
  }
}

function handleInteraction(){
  const pc=Math.round(player.x), pr=Math.floor(player.y+PH/2);
  const checks=[[pc,pr],[pc,pr+1],[pc,pr-1],[pc-1,pr],[pc+1,pr],[Math.floor(player.x),Math.floor(player.y+PH-0.1)]];
  const seen=new Set();
  for(const [c,r] of checks){
    const key=c+','+r; if(seen.has(key))continue; seen.add(key);
    const t=getTile(c,r);
    if(t==='D'){
      const trans=TRANSITIONS[currentRoom]; const dk=c+'_'+r;
      if(trans&&trans[dk]){
        const dest=trans[dk];
        if(dest==='COMPLETE'){gameState='COMPLETE';completionTimer=0;Audio.complete();return;}
        Audio.doorChime(); startTransition(dest); return;
      }
    }
    if(t==='S'){
      if(currentRoom==='R03'){
        if(c===8&&r===10){ syncState.termA=true; if(!syncState.active){syncState.active=true;syncState.timer=SYNC_TIMER;} Audio.interact();showDialogue('RELAY A ACTIVATED.\nREACH RELAY B.'); return; }
        if(c===19&&r===10){ syncState.termB=true; if(!syncState.active){syncState.active=true;syncState.timer=SYNC_TIMER;} Audio.interact();showDialogue('RELAY B ACTIVATED.'); return; }
      }
      player.checkpoint={room:currentRoom,x:player.x,y:player.y}; Audio.interact(); showDialogue('CHECKPOINT SAVED.\nSTABILITY PRESERVED.'); return;
    }
    if(t==='G'){ const txt=GLYPH_TEXT[currentRoom+'_'+c+'_'+r]; if(txt){Audio.interact();showDialogue(txt);} return; }
  }
}

function useTool(idx){
  const tool=player.pocket[idx]; if(!tool)return;
  toolCooldown=TOOL_COOLDOWN; Audio.tool(tool.id);
  const pc=Math.round(player.x), pr=Math.floor(player.y+PH/2);
  toolEffect={x:player.x,y:player.y+PH/2,timer:18,type:tool.id,facing:player.facing};
  const inRange=(fn)=>{ for(let dr=-TOOL_RANGE;dr<=TOOL_RANGE;dr++)for(let dc=-TOOL_RANGE;dc<=TOOL_RANGE;dc++)fn(pc+dc,pr+dr); };
  const oy=HUD_ROWS*T; // pixel-space helper for particle origins
  switch(tool.id){
    case'PULSE':
      inRange((c,r)=>{ if(getTile(c,r)==='X'){roomTiles[r][c]='.';clearedTiles[currentRoom+'_'+c+'_'+r]=true;
        // white flash + dissolve sparks at cleared X
        const cx=c*T+T/2, cy=oy+r*T+T/2;
        spawnParticle({x:cx,y:cy,vx:0,vy:0,life:6,maxLife:6,color:'255,255,255',size:T*0.9,kind:'flash'});
        for(let k=0;k<8;k++){const a=Math.random()*Math.PI*2,sp=1+Math.random()*2;
          spawnParticle({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18+Math.random()*10,maxLife:28,color:'255,90,90',size:T*0.18,kind:'spark',drag:0.92});}
      } });
      for(const s of scouts){ if(Math.abs(s.x-player.x)<TOOL_RANGE&&Math.abs(s.y-player.y)<TOOL_RANGE){ if(s.state==='PATROL'||s.state==='RECOVERY'){s.state='STUNNED';s.stunTimer=120;Audio.stun();} } }
      break;
    case'SCANNER':
      inRange((c,r)=>{ if(getTile(c,r)==='H'){roomTiles[r][c]='_';revealedH[currentRoom+'_'+c+'_'+r]=true;
        const cx=c*T+T/2, cy=oy+r*T+T/2;
        spawnParticle({x:cx,y:cy,vx:0,vy:0,life:24,maxLife:24,color:'130,177,255',size:T,kind:'reveal'});
      } }); break;
    case'SYNC':
      // Persistent link beam toward nearest S terminal tile (visual only). Hint text preserved.
      {
        let best=null,bd=1e9;
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ if(getTile(c,r)==='S'){ const d=Math.hypot(c-player.x,r-(player.y+PH/2)); if(d<bd){bd=d;best={c,r};} } }
        if(best){ syncBeam={x0:player.x*T,y0:oy+(player.y+PH/2)*T,x1:best.c*T+T/2,y1:oy+best.r*T+T/2,timer:90}; }
      }
      showDialogue('USE AT A RELAY\nTERMINAL.');
      break;
    case'THERMAL':
      inRange((c,r)=>{ const t=getTile(c,r); if(t==='V'||t==='~'){roomTiles[r][c]=t==='V'?'_':'.';clearedTiles[currentRoom+'_'+c+'_'+r]=true;
        coolTiles.push({room:currentRoom,c,r,timer:24,wasVent:t==='V'});
        const cx=c*T+T/2, cy=oy+r*T+T/2;
        for(let k=0;k<5;k++){const a=Math.random()*Math.PI*2,sp=0.6+Math.random()*1.4;
          spawnParticle({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.4,life:20+Math.random()*10,maxLife:30,color:'120,160,255',size:T*0.22,kind:'steam',drag:0.95});}
      } }); break;
    case'CATALYST':
      inRange((c,r)=>{ if(getTile(c,r)==='C'){roomTiles[r][c]='.';clearedTiles[currentRoom+'_'+c+'_'+r]=true;
        const cx=c*T+T/2, cy=oy+r*T+T/2;
        for(let k=0;k<10;k++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*2.5;
          spawnParticle({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+Math.random()*12,maxLife:36,color:'213,0,249',size:T*0.16+Math.random()*T*0.12,kind:'shard',grav:0.08,rot:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.4,drag:0.97});}
      } }); break;
    case'READER': useReader(); break;
    case'CHKPT': player.checkpoint={room:currentRoom,x:Math.round(player.x),y:Math.floor(player.y)}; showDialogue('CHECKPOINT SET.');
      { const cx=player.x*T, cy=oy+(player.y+PH)*T;
        for(let k=0;k<14;k++){
          spawnParticle({x:cx+(Math.random()-0.5)*T*0.7,y:cy,vx:(Math.random()-0.5)*0.3,vy:-1-Math.random()*1.5,life:26+Math.random()*14,maxLife:40,color:'105,240,174',size:T*0.16,kind:'rise',drag:0.98});}
      } break;
  }
}

// ─── READER TOOL ─────────────────────────────────────────────────────────
// Reader emits a radio-wave pulse and detects nearby Reader glyphs.
// It does NOT interact with G tiles (those belong to Interact/Up).
// It does NOT reveal H tiles (that belongs to SCANNER).
// It does NOT activate S terminals (that belongs to SYNC/Interact).
function useReader(){
  const oy=HUD_ROWS*T;
  // Radio-wave visual (distinct: three expanding concentric rings, slower than PULSE).
  toolEffect={x:player.x,y:player.y+PH/2,timer:28,type:'READER',facing:player.facing};
  // Detect Reader glyphs in range.
  const nearby=READER_GLYPHS.filter(g=>{
    if(g.room!==currentRoom)return false;
    return Math.hypot(g.col-player.x, g.row-(player.y+PH/2)) <= READER_RANGE;
  });
  if(nearby.length===0){
    showDialogue('READER: NO SIGNAL\nIN RANGE.');
    return;
  }
  // Read the first undiscovered glyph; if all discovered, re-read the nearest.
  const unread=nearby.filter(g=>!readerDiscovered[g.id]);
  const target=unread.length>0 ? unread[0] : nearby[0];
  readerDiscovered[target.id]=true;
  // Mark discovered flag on the object for rendering.
  const obj=READER_GLYPHS.find(g=>g.id===target.id);
  if(obj)obj.discovered=true;
  showDialogue('[READER]\n'+target.text);
}

function showDialogue(text){ dialogue={text,timer:200,reveal:0,len:text.replace(/\n/g,'').length}; }
function updateDialogue(){ if(dialogue){ dialogue.timer--; if(dialogue.reveal<dialogue.len)dialogue.reveal+=0.6; if(dialogue.timer<=0)dialogue=null; } }

// ─── TOOLKIT ─────────────────────────────────────────────────
// SVG icons matching the canvas HUD tool icons.
function toolSVG(id,col){
  const c=col||'#c5cae9';
  const wrap=(inner)=>`<svg class="tk-ico" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  switch(id){
    case'PULSE':    return wrap('<circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8"/>');
    case'SCANNER':  return wrap('<circle cx="10" cy="10" r="6"/><line x1="14.5" y1="14.5" x2="20" y2="20"/>');
    case'SYNC':     return wrap('<circle cx="7" cy="12" r="3.5"/><circle cx="17" cy="12" r="3.5"/><line x1="10.5" y1="12" x2="13.5" y2="12"/>');
    case'THERMAL':  return wrap('<line x1="12" y1="3" x2="12" y2="21"/><line x1="4" y1="7.5" x2="20" y2="16.5"/><line x1="4" y1="16.5" x2="20" y2="7.5"/>');
    case'CATALYST': return wrap('<polygon points="12,3 19,12 12,21 5,12"/>');
    case'CHKPT':    return wrap('<line x1="7" y1="3" x2="7" y2="21"/><polygon points="7,4 18,7 7,10" fill="'+c+'"/>');
    case'READER':   return wrap('<circle cx="12" cy="12" r="3" fill="'+c+'"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9"/>');
    default:        return wrap('<rect x="6" y="6" width="12" height="12"/>');
  }
}
function tkSlotColor(id){return {PULSE:'#ff5a5a',SCANNER:'#82b1ff',SYNC:'#69f0ae',THERMAL:'#8c9eff',CATALYST:'#d500f9',CHKPT:'#69f0ae',READER:'#00dcb4'}[id]||'#c5cae9';}

let tkCursor=0; // animated selection cursor index
function openToolkit(){ gameState='TOOLKIT'; tkMode=0; tkCursor=ALL_TOOLS.findIndex(t=>player.pocket[0]&&t.id===player.pocket[0].id); if(tkCursor<0)tkCursor=0;
  const ov=document.getElementById('toolkit-overlay'); ov.classList.remove('closing'); ov.classList.add('show'); renderToolkitUI(); }
function closeToolkit(){
  const ov=document.getElementById('toolkit-overlay');
  ov.classList.add('closing');
  Audio.interact(); // mechanical click on close
  setTimeout(()=>{ ov.classList.remove('show'); ov.classList.remove('closing'); },180);
  gameState='PLAY';
}
function renderToolkitUI(){
  const list=document.getElementById('tk-list');
  document.getElementById('tk-sub').textContent = tkMode===0?'SELECT POCKET A':'SELECT POCKET B';
  list.innerHTML='';
  ALL_TOOLS.forEach((tool,i)=>{
    const p1=player.pocket[0]&&player.pocket[0].id===tool.id, p2=player.pocket[1]&&player.pocket[1].id===tool.id;
    const card=document.createElement('div'); card.className='tk-card';
    if(p1&&p2)card.classList.add('eqAB'); else if(p1)card.classList.add('eqA'); else if(p2)card.classList.add('eqB');
    if(i===tkCursor)card.classList.add('cursor');
    let badge='';
    if(p1)badge+='<span class="tk-badge A">A</span>';
    if(p2)badge+='<span class="tk-badge B">B</span>';
    card.innerHTML=toolSVG(tool.id,tkSlotColor(tool.id))+
      '<div class="tk-meta"><div class="tk-name">'+tool.name+' '+badge+'</div><div class="tk-desc">'+tool.desc+'</div></div>';
    card.addEventListener('click',()=>selectTool(i));
    card.addEventListener('touchend',e=>{e.preventDefault();selectTool(i);});
    list.appendChild(card);
  });
  // Footer pocket status with icons.
  const footer=document.getElementById('tk-footer'); footer.innerHTML='';
  [['A',player.pocket[0]],['B',player.pocket[1]]].forEach(([lab,tl])=>{
    const slot=document.createElement('div'); slot.className='tk-slot';
    const col=lab==='A'?'#5b9bd5':'#ff5a5a';
    slot.innerHTML=toolSVG(tl?tl.id:null,tl?tkSlotColor(tl.id):'#5c6170')+
      '<span class="lbl" style="color:'+col+'">'+lab+': '+(tl?tl.name:'---')+'</span>';
    footer.appendChild(slot);
  });
}
function selectTool(i){
  // brief flash feedback on the chosen card
  const cards=document.querySelectorAll('.tk-card');
  if(cards[i]){ cards[i].classList.add('flash'); setTimeout(()=>cards[i]&&cards[i].classList.remove('flash'),70); }
  Audio.tool(ALL_TOOLS[i].id);
  player.pocket[tkMode]=ALL_TOOLS[i];
  if(tkMode===0){ tkMode=1; tkCursor=ALL_TOOLS.findIndex(t=>player.pocket[1]&&t.id===player.pocket[1].id); if(tkCursor<0)tkCursor=0; setTimeout(renderToolkitUI,80); }
  else { setTimeout(closeToolkit,90); }
}

// RENDER
// ═══════════════════════════════════════════════════════════════
function render(){
  ctx.fillStyle=NES.bg; ctx.fillRect(0,0,GW,GH);
  if(gameState==='TITLE'){renderTitle();return;}
  if(gameState==='COMPLETE'){renderComplete();return;}
  const oy=HUD_ROWS*T;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)renderTile(c,r,c*T,oy+r*T);
  for(const s of scouts)renderScout(s,oy);
  renderCoolTiles(oy);
  renderPlayer(oy);
  if(toolEffect)renderToolEffect(oy);
  renderSyncBeam();
  renderParticles();
  renderHUD();
  renderReaderGlyphs(oy);
  if(dialogue)renderDialogue(oy);
  if(syncState.active){
    const barW=(syncState.timer/SYNC_TIMER)*(GW-T*4);
    ctx.fillStyle=syncState.timer<60?NES.fault:NES.termOn; ctx.fillRect(T*2,oy-T*0.4,barW,T*0.3);
    ctx.strokeStyle=NES.hudDim; ctx.lineWidth=1; ctx.strokeRect(T*2,oy-T*0.4,GW-T*4,T*0.3);
  }
  if(gameState==='PAUSED'){
    ctx.fillStyle='rgba(10,10,26,0.7)'; ctx.fillRect(0,0,GW,GH);
    const fs=Math.max(8,Math.floor(T*0.6)); ctx.font=fs+'px "Press Start 2P",monospace';
    ctx.fillStyle=NES.dialogBd; ctx.textAlign='center'; ctx.fillText('PAUSED',GW/2,GH*0.45);
    ctx.font=Math.floor(fs*0.6)+'px "Press Start 2P",monospace'; ctx.fillStyle=NES.hudDim;
    if(frame%40<25)ctx.fillText('PRESS START',GW/2,GH*0.55);
  }
  // Fade-to-black room transition overlay (visual only).
  if(fade.active){
    let a;
    if(fade.phase==='out') a=1-(fade.timer/FADE_FRAMES);
    else a=(fade.timer/FADE_FRAMES);
    ctx.fillStyle='rgba(10,10,26,'+Math.max(0,Math.min(1,a))+')';
    ctx.fillRect(0,0,GW,GH);
  }
}

// Select which atlas frame to show for a tile this game-frame.
function tileFrame(t,c,r){
  const f=frame;
  switch(t){
    case'D': return (f%40<20)?1:0;
    case'S': return Math.floor(f/8)%4;
    case'G': return Math.floor(f/12)%3;
    case'X': return (f%14<7)?0:1;
    case'C': return Math.floor(f/12)%4;
    case'V': return ventActivePhase()?1:0;
    case'~': return ventActivePhase()?(Math.floor(f/10)%3):0;
    case'=': return Math.floor(f/6)%4;
    case'<': return Math.floor(f/6)%4;
    default:  return 0;
  }
}

function blitTile(t,fr,x,y){
  const info=tileIndex[t]; if(!info)return;
  const sx=fr*TILE_PX, sy=info.row*TILE_PX;
  ctx.drawImage(tileset, sx, sy, TILE_PX, TILE_PX, x, y, T, T);
}

function renderTile(c,r,x,y){
  const t=roomTiles[r]?roomTiles[r][c]:'#'; const s=T, f=frame;
  // Non-drawn tiles.
  if(t==='.'||t==='E')return;
  if(t==='H'){ if(f%90<6) blitTile('H',0,x,y); return; } // hidden barely shimmers
  if(t==='~'&&!ventActivePhase()){ ctx.fillStyle='rgba(255,109,0,0.12)'; ctx.fillRect(x,y,s,s); return; }

  // Base blit from pre-rendered atlas.
  blitTile(t, tileFrame(t,c,r), x, y);

  // ── Overflow / dynamic accents that exceed a 16x16 cell ──
  // (Bulk art is now in the tileset; these keep the exact prior identity.)
  switch(t){
    case'D': {
      const pulse=0.5+0.5*Math.sin(f*0.12);
      ctx.fillStyle='rgba(252,231,110,'+(0.10+0.22*pulse)+')'; ctx.fillRect(x-s*0.25,y-s*0.25,s*1.5,s*1.5);
      blitTile('D', tileFrame('D'), x, y); // redraw hatch over halo
      ctx.fillStyle='rgba(252,231,110,'+(0.4+0.6*pulse)+')';
      ctx.font='bold '+Math.floor(s*0.4)+'px monospace'; ctx.textAlign='center';
      ctx.fillText('▸',x+s*0.5,y+s*0.55);
      break; }
    case'G': {
      const rr=(f%40)/40; ctx.strokeStyle='rgba(130,177,255,'+(0.5*(1-rr))+')'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.3+rr*s*0.35,0,Math.PI*2); ctx.stroke();
      const bob=Math.sin(f*0.15)*s*0.1;
      ctx.fillStyle=NES.glyphLt; ctx.font='bold '+Math.floor(s*0.3)+'px monospace'; ctx.textAlign='center';
      ctx.fillText('▾',x+s/2,y-s*0.15+bob);
      break; }
    case'X': {
      // sparking arcs that radiate beyond the box
      ctx.strokeStyle='rgba(255,90,90,'+(0.5+0.5*Math.sin(f*0.5))+')'; ctx.lineWidth=1;
      for(let i=0;i<3;i++){
        const a=(f*0.2+i*2.1)%(Math.PI*2); const x0=x+s/2, y0=y+s/2;
        ctx.beginPath(); ctx.moveTo(x0,y0);
        ctx.lineTo(x0+Math.cos(a)*s*0.4, y0+Math.sin(a)*s*0.4);
        ctx.lineTo(x0+Math.cos(a+0.3)*s*0.5, y0+Math.sin(a+0.3)*s*0.5);
        ctx.stroke();
      }
      break; }
    case'V': {
      if(ventActivePhase()){
        for(let i=0;i<5;i++){
          const ph=(f*0.04+i*0.7)%1; const py2=y-ph*s*1.3;
          const spread=Math.sin(f*0.05+i)*s*0.18*ph; const al=0.5*(1-ph);
          ctx.fillStyle='rgba(255,180,90,'+al+')'; const sz=s*0.12+ph*s*0.15;
          ctx.fillRect(x+s*0.4+spread, py2, sz, sz);
        }
      }
      break; }
    case'~': {
      if(ventActivePhase()){
        for(let i=0;i<3;i++){
          const ph=(f*0.05+i*0.6+c*0.3)%1;
          ctx.fillStyle='rgba(255,140,80,'+(0.4*(1-ph))+')';
          const sz=s*0.2+ph*s*0.2;
          ctx.fillRect(x+s*0.3+Math.sin(f*0.06+i)*s*0.2, y+s-ph*s*0.9, sz, sz);
        }
      }
      break; }
  }
}

// Eli sprite palette (logistics technician).
const ELI={
  H:'#fce76e', // hard hat / highlight (yellow)
  Hd:'#d4a017',// hat shadow
  S:'#e0a878', // skin
  Sd:'#b07b50',// skin shadow
  W:'#3b6ea5', // workwear (blue coveralls)
  Wd:'#274d77',// workwear shadow
  B:'#5a4632', // tool belt (brown)
  Bd:'#3a2c1f',// belt buckle/pouch
  T:'#c5cae9', // tool glint / metal
  K:'#1a1a2e', // outline/dark
  E:'#0a0a1a', // eye
};
// 12x16 pixel matrices. '.'=transparent. Keyed letters map to ELI palette.
// Idle / two walk-contact frames differ in leg position. Climb is a back/rungs pose.
const ELI_SPR={
  idle:[
    '....HHHH....','...HHHHHH...','...HHHHHH...','...KSSSSK...',
    '...SEsSEs...','...SSSSSS...','....SSSS....','..WWWWWWWW..',
    '..WWWWWWWW..','.WWWWWWWWWW.','.BBBBBBBBBB.','.BdBBBBBBdB.',
    '.WWWW..WWWW.','.WWWW..WWWW.','.KKK....KKK.','.KK......KK.'],
  walk1:[
    '....HHHH....','...HHHHHH...','...HHHHHH...','...KSSSSK...',
    '...SEsSEs...','...SSSSSS...','....SSSS....','..WWWWWWWW..',
    '..WWWWWWWW..','.WWWWWWWWWW.','.BBBBBBBBBB.','.BdBBBBBBdB.',
    '..WWWWWWW...','..WWW.WWWW..','..KK...KKK..','.KK......KK.'],
  walk2:[
    '....HHHH....','...HHHHHH...','...HHHHHH...','...KSSSSK...',
    '...SEsSEs...','...SSSSSS...','....SSSS....','..WWWWWWWW..',
    '..WWWWWWWW..','.WWWWWWWWWW.','.BBBBBBBBBB.','.BdBBBBBBdB.',
    '...WWWWWWW..','..WWWW.WWW..','..KKK...KK..','.KK......KK.'],
  climb:[
    '....HHHH....','...HHHHHH...','...HHHHHH...','...SSSSSS...',
    '...SSSSSS...','..WTWWWWTW..','..WWWWWWWW..','.WWWWWWWWWW.',
    '.WWWWWWWWWW.','.BBBBBBBBBB.','..WWWWWWWW..','..WW.WW.WW..',
    '..WW.WW.WW..','..KK.WW.KK..','..KK....KK..','...K....K...'],
};
function drawSprite(mtx,px,py,cell,flip){
  for(let r=0;r<mtx.length;r++){
    const row=mtx[r];
    for(let c=0;c<row.length;c++){
      const ch=row[c]; if(ch==='.')continue;
      let col;
      switch(ch){case'H':col=ELI.H;break;case'h':case'Hd':col=ELI.Hd;break;
        case'S':col=ELI.S;break;case's':col=ELI.Sd;break;
        case'W':col=ELI.W;break;case'w':col=ELI.Wd;break;
        case'B':col=ELI.B;break;case'd':col=ELI.Bd;break;
        case'T':col=ELI.T;break;case'K':col=ELI.K;break;case'E':col=ELI.E;break;
        default:col=ELI.W;}
      const cx=flip?(row.length-1-c):c;
      ctx.fillStyle=col;
      ctx.fillRect(px+cx*cell, py+r*cell, cell+0.5, cell+0.5);
    }
  }
}
function renderPlayer(oy){
  // Hit flash: blink + red tint handled by skipping frames (preserves iFrame behavior).
  const flashing = player.iFrames>0;
  if(flashing && Math.floor(player.iFrames/4)%2===0)return;
  const cols=12, rows=16;
  const cell=T/cols*0.95;
  const sprW=cols*cell;
  // Anchor: sprite spans Eli's body box (width ~0.64 tile, height ~1.4 tile).
  const px=player.x*T - sprW/2;
  const py=oy + player.y*T + (PH*T - rows*cell) ; // feet aligned to body bottom
  const flip=player.facing===-1;
  let mtx;
  if(player.onLadder){
    mtx=ELI_SPR.climb;
  } else if(isDown('left')||isDown('right')){
    const phase=Math.floor(frame/6)%4; // 4-frame cycle: idle,walk1,idle,walk2
    mtx=(phase===1)?ELI_SPR.walk1:(phase===3)?ELI_SPR.walk2:ELI_SPR.idle;
  } else {
    mtx=ELI_SPR.idle;
  }
  drawSprite(mtx,px,py,cell,flip);
  // Hit flash red overlay
  if(flashing){
    ctx.fillStyle='rgba(255,23,68,0.35)';
    ctx.fillRect(px,py,sprW,rows*cell);
  }
}

function renderScout(s,oy){
  const sx=s.x*T, sy=oy+s.y*T, sz=T; let color;
  switch(s.state){case'PATROL':color=NES.scout;break;case'STUNNED':color=NES.scoutSt;break;case'RECOVERY':color=NES.scoutRc;break;default:color=NES.scout;}
  if(s.kind==='drone'){
    // Hovering scanner drone: rounded chassis, sweeping scanner eye, thruster glow.
    const cx=sx, cy=sy+sz*0.7;
    // thruster glow underneath
    if(s.state!=='STUNNED'){ ctx.fillStyle='rgba(130,177,255,0.35)'; ctx.fillRect(sx-sz*0.2, cy+sz*0.3, sz*0.4, sz*0.18); }
    // chassis
    ctx.fillStyle=color; ctx.fillRect(sx-sz*0.4,cy-sz*0.25,sz*0.8,sz*0.5);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(sx-sz*0.4,cy+sz*0.15,sz*0.8,sz*0.1);
    // scanning eye sweeps left-right with travel direction
    const eyeOff=s.dir*sz*0.12;
    ctx.fillStyle=s.state==='STUNNED'?NES.hudDim:'#82b1ff';
    ctx.fillRect(sx-sz*0.12+eyeOff,cy-sz*0.1,sz*0.24,sz*0.16);
    ctx.fillStyle=s.state==='STUNNED'?NES.hudDim:NES.white;
    ctx.fillRect(sx-sz*0.04+eyeOff,cy-sz*0.06,sz*0.08,sz*0.08);
    // scan beam hint downward (telegraphs its "scanner" identity)
    if(s.state==='PATROL'){ ctx.fillStyle='rgba(130,177,255,'+(0.15+0.1*Math.sin(frame*0.2))+')'; ctx.fillRect(sx-sz*0.06,cy+sz*0.25,sz*0.12,sz*0.5); }
    if(s.state==='STUNNED'){ ctx.fillStyle=NES.doorLt; const so=Math.sin(frame*0.15)*sz*0.2; ctx.font=Math.floor(sz*0.3)+'px monospace'; ctx.textAlign='center'; ctx.fillText('★',sx+so,cy-sz*0.3); }
    return;
  }
  ctx.fillStyle=color; ctx.fillRect(sx-sz*0.35,sy+sz*0.5,sz*0.7,sz*0.6);
  ctx.fillStyle=s.state==='STUNNED'?NES.hudDim:NES.white;
  ctx.fillRect(sx-sz*0.15,sy+sz*0.6,sz*0.12,sz*0.12); ctx.fillRect(sx+sz*0.05,sy+sz*0.6,sz*0.12,sz*0.12);
  if(s.state==='PATROL'){ctx.fillStyle=color; ctx.fillRect(sx+s.dir*sz*0.3,sy+sz*0.75,sz*0.15*s.dir,sz*0.1);}
  if(s.state==='STUNNED'){ ctx.fillStyle=NES.doorLt; const so=Math.sin(frame*0.15)*sz*0.2; ctx.font=Math.floor(sz*0.3)+'px monospace'; ctx.textAlign='center'; ctx.fillText('★',sx+so,sy+sz*0.4); ctx.fillText('★',sx-so,sy+sz*0.5); }
  ctx.fillStyle=s.state==='STUNNED'?NES.hudDim:NES.white;
  const wa=s.state==='PATROL'?Math.sin(frame*0.2)*sz*0.05:0;
  ctx.fillRect(sx-sz*0.25,sy+sz*1.1+wa,sz*0.15,sz*0.15); ctx.fillRect(sx+sz*0.1,sy+sz*1.1-wa,sz*0.15,sz*0.15);
}

function renderToolEffect(oy){
  if(!toolEffect)return;
  const ex=toolEffect.x*T, ey=oy+toolEffect.y*T;
  const tt=toolEffect.timer, dur=18, prog=1-(tt/dur); // 0..1
  switch(toolEffect.type){
    case'PULSE': {
      // Contract-then-snap-outward shockwave with edge sparks.
      let radius;
      if(prog<0.35) radius=TOOL_RANGE*T*(0.5*(1-prog/0.35)); // contract inward
      else { const p2=(prog-0.35)/0.65; radius=TOOL_RANGE*T*p2; } // snap out
      const a=0.7*(1-prog);
      ctx.strokeStyle='rgba(255,23,68,'+a+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='rgba(255,140,140,'+a*0.7+')'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(ex,ey,Math.max(0,radius*0.7),0,Math.PI*2); ctx.stroke();
      // edge sparks
      if(prog>0.35){ for(let i=0;i<8;i++){ const ang=i/8*Math.PI*2+prog*2; const sx=ex+Math.cos(ang)*radius, sy=ey+Math.sin(ang)*radius;
        ctx.fillStyle='rgba(255,200,120,'+a+')'; ctx.fillRect(sx-1.5,sy-1.5,3,3); } }
      break; }
    case'SCANNER': {
      // Expanding circle + rotating radar sweep line.
      const radius=TOOL_RANGE*T*prog; const a=0.6*(1-prog);
      ctx.strokeStyle='rgba(68,138,255,'+a+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2); ctx.stroke();
      const sweep=prog*Math.PI*4;
      const grad=ctx.createLinearGradient(ex,ey,ex+Math.cos(sweep)*radius,ey+Math.sin(sweep)*radius);
      grad.addColorStop(0,'rgba(130,177,255,'+(0.5*(1-prog))+')'); grad.addColorStop(1,'rgba(130,177,255,0)');
      ctx.strokeStyle=grad; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex+Math.cos(sweep)*radius,ey+Math.sin(sweep)*radius); ctx.stroke();
      break; }
    case'SYNC': {
      const radius=TOOL_RANGE*T*prog*0.5; const a=0.5*(1-prog);
      ctx.strokeStyle='rgba(0,200,83,'+a+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2); ctx.stroke();
      break; }
    case'THERMAL': {
      // Rippling heat-dissipation rings (multiple offset wavefronts).
      for(let w=0;w<3;w++){
        const wp=prog-w*0.18; if(wp<=0)continue;
        const radius=TOOL_RANGE*T*wp; const a=0.4*(1-wp);
        const wob=Math.sin(frame*0.5+w)*2;
        ctx.strokeStyle='rgba(255,140,40,'+a+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ex,ey,Math.max(0,radius+wob),0,Math.PI*2); ctx.stroke();
      }
      break; }
    case'CATALYST': {
      const radius=TOOL_RANGE*T*prog; const a=0.45*(1-prog);
      ctx.strokeStyle='rgba(170,0,255,'+a+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ex,ey,Math.max(0,radius),0,Math.PI*2); ctx.stroke();
      break; }
    case'CHKPT': {
      const a=0.5*(1-prog);
      const grad=ctx.createLinearGradient(ex,ey+T,ex,ey-T*2);
      grad.addColorStop(0,'rgba(105,240,174,0)'); grad.addColorStop(0.5,'rgba(105,240,174,'+a+')'); grad.addColorStop(1,'rgba(105,240,174,0)');
      ctx.fillStyle=grad; ctx.fillRect(ex-T*0.4,ey-T*2,T*0.8,T*3);
      break; }
    case'READER': {
      // Three slow concentric radio-wave rings; each offset by 1/3 of the duration.
      for(let wave=0; wave<3; wave++){
        const wp=Math.max(0, prog - wave*0.22);
        if(wp<=0)continue;
        const r=READER_RANGE*T*wp;
        const a=(0.6*(1-wp))*(1-wave*0.2);
        ctx.strokeStyle='rgba(0,220,180,'+a+')'; ctx.lineWidth=1.5+wave*0.5;
        ctx.beginPath(); ctx.arc(ex,ey,Math.max(0,r),0,Math.PI*2); ctx.stroke();
      }
      // Small center pulse confirming activation.
      ctx.fillStyle='rgba(0,220,180,'+(0.5*(1-prog))+')';
      ctx.beginPath(); ctx.arc(ex,ey,T*0.3,0,Math.PI*2); ctx.fill();
      break; }
  }
}

function renderParticles(){
  for(const p of particles){
    const a=Math.max(0,p.life/p.maxLife);
    switch(p.kind){
      case'flash': ctx.fillStyle='rgba('+p.color+','+a+')'; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); break;
      case'spark': case'rise': case'steam':
        ctx.fillStyle='rgba('+p.color+','+a+')'; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); break;
      case'reveal':
        ctx.strokeStyle='rgba('+p.color+','+a+')'; ctx.lineWidth=1.5; ctx.strokeRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
        ctx.fillStyle='rgba('+p.color+','+(a*0.3)+')'; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); break;
      case'shard': {
        if(p.rot!==undefined)p.rot+=p.vr||0;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot||0);
        ctx.fillStyle='rgba('+p.color+','+a+')';
        ctx.beginPath(); ctx.moveTo(0,-p.size); ctx.lineTo(p.size*0.7,0); ctx.lineTo(0,p.size); ctx.lineTo(-p.size*0.7,0); ctx.closePath(); ctx.fill();
        ctx.restore(); break; }
      default: ctx.fillStyle='rgba('+p.color+','+a+')'; ctx.fillRect(p.x-1,p.y-1,2,2);
    }
  }
}

function renderCoolTiles(oy){
  for(const ct of coolTiles){
    if(ct.room!==currentRoom)continue;
    const x=ct.c*T, y=oy+ct.r*T, a=ct.timer/24;
    // hot -> cool blue tint fading out
    ctx.fillStyle='rgba(80,140,255,'+(0.5*a)+')'; ctx.fillRect(x,y,T,T);
    ctx.fillStyle='rgba(200,230,255,'+(0.3*a)+')'; ctx.fillRect(x,y,T,2);
  }
}

function renderSyncBeam(){
  if(!syncBeam)return;
  const a=Math.min(1,syncBeam.timer/30)*0.7;
  const pulse=0.5+0.5*Math.sin(frame*0.4);
  // beam follows player origin live
  const oy=HUD_ROWS*T;
  const x0=player.x*T, y0=oy+(player.y+PH/2)*T;
  ctx.strokeStyle='rgba(0,200,83,'+(a*(0.5+0.5*pulse))+')'; ctx.lineWidth=2+pulse*1.5;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(syncBeam.x1,syncBeam.y1); ctx.stroke();
  ctx.strokeStyle='rgba(130,255,180,'+a+')'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(syncBeam.x1,syncBeam.y1); ctx.stroke();
  // node pulses at each end
  ctx.fillStyle='rgba(130,255,180,'+a+')';
  ctx.beginPath(); ctx.arc(syncBeam.x1,syncBeam.y1,3+pulse*2,0,Math.PI*2); ctx.fill();
}

function drawToolIcon(id,cx,cy,sz){
  // Small vector glyph per tool, drawn centered in sz box.
  const h=sz/2;
  ctx.save(); ctx.translate(cx,cy); ctx.lineWidth=1.5; ctx.lineCap='round';
  switch(id){
    case'PULSE': // concentric burst
      ctx.strokeStyle=NES.fault; ctx.beginPath(); ctx.arc(0,0,h*0.5,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,h*0.85,0,Math.PI*2); ctx.stroke(); break;
    case'SCANNER': // magnifier
      ctx.strokeStyle=NES.glyphLt; ctx.beginPath(); ctx.arc(-h*0.2,-h*0.2,h*0.5,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(h*0.15,h*0.15); ctx.lineTo(h*0.7,h*0.7); ctx.stroke(); break;
    case'SYNC': // two linked nodes
      ctx.strokeStyle=NES.termOn; ctx.beginPath(); ctx.arc(-h*0.45,0,h*0.3,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(h*0.45,0,h*0.3,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-h*0.15,0); ctx.lineTo(h*0.15,0); ctx.stroke(); break;
    case'THERMAL': // snowflake/cool
      ctx.strokeStyle=NES.convLt; for(let a=0;a<6;a++){ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a*Math.PI/3)*h*0.8,Math.sin(a*Math.PI/3)*h*0.8); ctx.stroke();} break;
    case'CATALYST': // diamond crystal
      ctx.strokeStyle=NES.catLt; ctx.beginPath(); ctx.moveTo(0,-h*0.8); ctx.lineTo(h*0.6,0); ctx.lineTo(0,h*0.8); ctx.lineTo(-h*0.6,0); ctx.closePath(); ctx.stroke(); break;
    case'CHKPT': // flag
      ctx.strokeStyle=NES.stab; ctx.beginPath(); ctx.moveTo(-h*0.4,-h*0.8); ctx.lineTo(-h*0.4,h*0.8); ctx.stroke();
      ctx.fillStyle=NES.stab; ctx.beginPath(); ctx.moveTo(-h*0.4,-h*0.8); ctx.lineTo(h*0.5,-h*0.45); ctx.lineTo(-h*0.4,-h*0.1); ctx.closePath(); ctx.fill(); break;
    default: ctx.strokeStyle=NES.hudDim; ctx.strokeRect(-h*0.5,-h*0.5,h,h);
  }
  ctx.restore();
}
function renderReaderGlyphs(oy){
  // Draw floating Reader glyph indicators in the current room.
  // Discovered glyphs show a solid teal diamond; undiscovered show a faint pulsing outline.
  const glyphs=READER_GLYPHS.filter(g=>g.room===currentRoom);
  for(const g of glyphs){
    const gx=g.col*T, gy=oy+g.row*T;
    const pulse=0.4+0.3*Math.sin(frame*0.08+g.col);
    if(readerDiscovered[g.id]){
      // Discovered: solid teal diamond
      ctx.fillStyle='rgba(0,220,180,0.85)';
      ctx.beginPath(); ctx.moveTo(gx+T/2,gy); ctx.lineTo(gx+T,gy+T/2); ctx.lineTo(gx+T/2,gy+T); ctx.lineTo(gx,gy+T/2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.font='bold '+Math.floor(T*0.4)+'px monospace'; ctx.textAlign='center'; ctx.fillText('R',gx+T/2,gy+T*0.62);
    } else {
      // Undiscovered: faint pulsing outline only
      ctx.strokeStyle='rgba(0,220,180,'+pulse+')'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(gx+T/2,gy+T*0.05); ctx.lineTo(gx+T*0.95,gy+T/2); ctx.lineTo(gx+T/2,gy+T*0.95); ctx.lineTo(gx+T*0.05,gy+T/2); ctx.closePath(); ctx.stroke();
    }
  }
}
function renderHUD(){
  const hudH=HUD_ROWS*T;
  ctx.fillStyle=NES.hudBg; ctx.fillRect(0,0,GW,hudH);
  ctx.strokeStyle=NES.dialogBd; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,hudH-0.5); ctx.lineTo(GW,hudH-0.5); ctx.stroke();
  const fs=Math.max(7,Math.floor(T*0.55)); ctx.font=fs+'px "Press Start 2P",monospace'; ctx.textAlign='left';
  ctx.fillStyle=NES.hudDim; ctx.fillText('D01-'+currentRoom,T*0.5,T*0.95);
  // Stability as battery cells.
  ctx.fillStyle=NES.hud; ctx.fillText('STB',T*0.5,T*2.05);
  const cellW=fs*1.4, cellH=fs*0.95, cellY=T*1.45, x0=T*0.5+fs*2.8;
  for(let i=0;i<3;i++){
    const cx=x0+i*(cellW+4);
    ctx.strokeStyle=NES.hudDim; ctx.lineWidth=1.5; ctx.strokeRect(cx,cellY,cellW,cellH);
    ctx.fillStyle=NES.hudDim; ctx.fillRect(cx+cellW,cellY+cellH*0.3,2,cellH*0.4); // terminal nub
    if(i<player.stability){
      const low=player.stability===1;
      ctx.fillStyle=low?NES.stabLo:NES.stab;
      ctx.fillRect(cx+1.5,cellY+1.5,cellW-3,cellH-3);
      ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(cx+1.5,cellY+1.5,cellW-3,2);
    }
  }
  // Tool pocket icons.
  const boxSz=fs*1.6, iy=hudH*0.5;
  const drawPocket=(label,tool,bx)=>{
    ctx.strokeStyle=NES.hudDim; ctx.lineWidth=1; ctx.strokeRect(bx,iy-boxSz/2,boxSz,boxSz);
    ctx.fillStyle=NES.hudDim; ctx.font=Math.floor(fs*0.7)+'px "Press Start 2P",monospace'; ctx.textAlign='left';
    ctx.fillText(label,bx,iy-boxSz/2-2);
    if(tool)drawToolIcon(tool.id,bx+boxSz/2,iy,boxSz*0.7);
    // Radial cooldown sweep (visual readiness indicator).
    if(toolCooldown>0){
      const frac=toolCooldown/TOOL_COOLDOWN;
      const cx=bx+boxSz/2, cy=iy, rad=boxSz*0.5;
      ctx.fillStyle='rgba(10,13,32,0.55)';
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(197,202,233,0.6)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,rad,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); ctx.stroke();
    }
  };
  drawPocket('A',player.pocket[0],GW-T*0.5-boxSz*2-6);
  drawPocket('B',player.pocket[1],GW-T*0.5-boxSz);
}

function renderDialogue(oy){
  if(!dialogue)return;
  const boxW=GW-T*2, boxH=T*2.5, boxX=T, boxY=oy+T*0.5;
  ctx.fillStyle='rgba(13,13,32,0.92)'; ctx.fillRect(boxX,boxY,boxW,boxH);
  ctx.strokeStyle=NES.dialogBd; ctx.lineWidth=1.5; ctx.strokeRect(boxX+1,boxY+1,boxW-2,boxH-2);
  const lines=dialogue.text.split('\n'); const fs=Math.max(6,Math.floor(T*0.5));
  ctx.font=fs+'px "Press Start 2P",monospace'; ctx.fillStyle=NES.white; ctx.textAlign='left';
  let shown=Math.floor(dialogue.reveal);
  for(let i=0;i<lines.length;i++){
    if(shown<=0)break;
    const seg=lines[i].slice(0,shown);
    ctx.fillText(seg,boxX+T*0.5,boxY+T*0.7+i*(fs+4));
    shown-=lines[i].length;
  }
  // blinking cursor while revealing
  if(dialogue.reveal<dialogue.len && frame%20<10){ ctx.fillStyle=NES.dialogBd; ctx.fillText('_',boxX+T*0.5,boxY+T*0.7+(lines.length-1)*(fs+4)); }
  if(frame%40<25){ ctx.fillStyle=NES.hudDim; ctx.font=Math.floor(fs*0.7)+'px "Press Start 2P",monospace'; ctx.textAlign='right'; ctx.fillText('START ▶',boxX+boxW-T*0.3,boxY+boxH-T*0.25); }
}

function renderTitle(){ ctx.fillStyle=NES.bg; ctx.fillRect(0,0,GW,GH); }
function renderComplete(){
  completionTimer++; ctx.fillStyle=NES.bg; ctx.fillRect(0,0,GW,GH);
  const fs=Math.max(8,Math.floor(T*0.6)); ctx.globalAlpha=Math.min(1,completionTimer/60);
  ctx.font=fs*1.5+'px "Press Start 2P",monospace'; ctx.fillStyle=NES.dialogBd; ctx.textAlign='center'; ctx.fillText('DISTRICT 01',GW/2,GH*0.35);
  ctx.font=fs+'px "Press Start 2P",monospace'; ctx.fillStyle=NES.termOn; ctx.fillText('LOGISTICS RESTORED',GW/2,GH*0.45);
  ctx.font=fs*0.7+'px "Press Start 2P",monospace'; ctx.fillStyle=NES.hudDim; ctx.fillText('ROUTES STILL MOVE.',GW/2,GH*0.58); ctx.fillText('PURPOSE DOES NOT.',GW/2,GH*0.64);
  if(completionTimer>120){ ctx.fillStyle=NES.hud; ctx.font=fs*0.6+'px "Press Start 2P",monospace'; if(frame%40<25)ctx.fillText('PRESS START',GW/2,GH*0.78); }
  ctx.globalAlpha=1;
}

// ═══════════════════════════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════════════════════════
function gameLoop(){
  frame++;
  switch(gameState){
    case'TITLE':
      if(wasPressed('start')||wasPressed('A')){ Audio.init(); Audio.resume(); Audio.startHum(); gameState='PLAY'; document.getElementById('title-screen').style.display='none'; loadRoom('R01'); } break;
    case'PLAY':
      if(wasPressed('start')){ if(dialogue)dialogue=null; else {gameState='PAUSED';break;} }
      updateFade();
      if(!(fade.active&&fade.phase==='out')){ updatePlayer(); updateScouts(); }
      updateDialogue(); break;
    case'PAUSED': if(wasPressed('start'))gameState='PLAY'; break;
    case'TOOLKIT': if(wasPressed('select')||wasPressed('start')){closeToolkit(); justPressed['tab']=false; justPressed['shift']=false; justPressed['enter']=false; justPressed[' ']=false;} break;
    case'COMPLETE':
      if(completionTimer>120&&(wasPressed('start')||wasPressed('A'))){ gameState='PLAY'; player.stability=3; player.checkpoint=null; clearedTiles={}; revealedH={}; loadRoom('R01'); } break;
  }
  if(gameState==='PLAY'&&wasPressed('select'))openToolkit();
  render();
  Object.keys(justPressed).forEach(k=>delete justPressed[k]);
  requestAnimationFrame(gameLoop);
}

function startGame(){ Audio.init(); Audio.resume(); Audio.startHum(); gameState='PLAY'; document.getElementById('title-screen').style.display='none'; loadRoom('R01'); }
document.getElementById('title-screen').addEventListener('click',startGame);
document.getElementById('title-screen').addEventListener('touchend',e=>{e.preventDefault();startGame();});

addEventListener('resize',resize);
buildTileset(); resize(); setupTouch(); requestAnimationFrame(gameLoop);
</script>
